<style>
/* Раскладка: одна колонка под палец, липкая шапка со счётчиками, нижняя панель вкладок. */
:root {
  --bg: #f4f4f5;
  --surface: #ffffff;
  --line: #dcdce1;
  --fg: #1d1d20;
  --muted: #66666f;
  --accent: #2f3640;        /* графит */
  --accent-fg: #ffffff;
  --marker: #fff200;        /* жёлтый маркер, как в Word */
  --marker-fg: #1f2419;
  --warn: #9a5b00;
  --warn-bg: #fff4dd;
  --danger: #b3261e;
  --display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --body: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131315; --surface: #1d1d20; --line: #34343a; --fg: #ececef; --muted: #a1a1aa;
    --accent: #e4e4e7; --accent-fg: #18181b; --marker: #e6d800; --marker-fg: #18181b;
    --warn: #f0b85a; --warn-bg: #3a2d12; --danger: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131315; --surface: #1d1d20; --line: #34343a; --fg: #ececef; --muted: #a1a1aa;
  --accent: #e4e4e7; --accent-fg: #18181b; --marker: #e6d800; --marker-fg: #18181b;
  --warn: #f0b85a; --warn-bg: #3a2d12; --danger: #ff8a80; color-scheme: dark;
}
* { box-sizing: border-box; }
/* Телефон не должен сам увеличивать текст в широких блоках: из-за этого в предпросмотре у газелей был разный шрифт. */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.4 var(--body); margin: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line); padding-block: 10px; margin-inline: -16px; padding-inline: 16px;
}
.top h1 { font: 700 17px/1.2 var(--display); margin: 0; letter-spacing: .01em; text-wrap: balance; }
.top .sub { color: var(--muted); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; white-space: pre-line; }
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px);
}
nav.tabs button { border: 0; background: none; color: var(--muted); font: 600 12px var(--body); padding: 12px 2px 14px; }
nav.tabs button[aria-current="page"] { color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); }
section { display: grid; gap: 14px; padding-top: 14px; }
h2 { font: 700 15px/1.3 var(--display); margin: 6px 0 0; }
h3 { font: 600 15px/1.3 var(--body); margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
@media (max-width: 380px) { .grid3 { grid-template-columns: 1fr 1fr; } }
label, .lbl { display: grid; gap: 4px; font-size: 12px; color: var(--muted); letter-spacing: .02em; min-width: 0; }
input, select, textarea {
  font: 16px/1.3 var(--body); color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0;
}
textarea { min-height: 120px; resize: vertical; }
/* На айфоне поле даты своё: без этого оно шире колонки и съезжает. */
input[type="date"] { -webkit-appearance: none; appearance: none; display: block; height: calc(1.3em + 20px); text-align: left; }
input[type="date"]::-webkit-date-and-time-value { text-align: left; }
input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn {
  font: 600 15px var(--body); border-radius: 8px; padding: 11px 14px; border: 1px solid var(--line);
  background: var(--surface); color: var(--fg); cursor: pointer;
}
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.small { padding: 7px 10px; font-size: 13px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row > .grow { flex: 1 1 160px; min-width: 0; }
.muted { color: var(--muted); font-size: 13px; }
.note { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg.owner { display: flex; } .seg.owner button { flex: 1; font-size: 16px; padding: 0; min-height: 42px; }
.seg button { border: 0; background: var(--surface); color: var(--muted); font: 600 13px var(--body); padding: 8px 10px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button.st-noshow[aria-pressed="true"] { background: var(--marker); color: var(--marker-fg); }
.seg button.st-refused[aria-pressed="true"] { background: var(--muted); color: var(--surface); }
.ghead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.count { font-variant-numeric: tabular-nums; font-weight: 600; }
.count.over { color: var(--danger); }
.person { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 8px; }
.person:first-of-type { border-top: 0; padding-top: 0; }
.person .line1 { display: grid; grid-template-columns: 24px 1fr 1fr 58px; gap: 6px; align-items: center; }
.person .line1 select { padding: 9px 4px; }
.person .num { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; font-size: 14px; }
.person.noshow .pname { background: var(--marker); color: var(--marker-fg); }
.person.refused .pname, .person.refused .pstop { text-decoration: line-through; color: var(--muted); }
.person .line2 { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; padding-left: 30px; }
.person .line2 .seg button { padding: 7px 6px; font-size: 12px; }
.person .line2 .ptail { margin-left: auto; display: inline-flex; gap: 4px; align-items: center; }
.sorthead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sorthead .btn { flex: none; }
.chip[aria-pressed="true"] { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); }
.badge.warnb { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.issue { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 6px; }
.issue:first-of-type { border-top: 0; padding-top: 0; }
.issue img, .shot img { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--line); justify-self: start; }
.chip { border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 999px; font: 600 12px var(--body); padding: 6px 10px; }
.phone { padding-left: 30px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.phone a { color: var(--accent); text-decoration: none; }
.more { padding-left: 30px; display: flex; gap: 6px; align-items: center; }
.more { flex-wrap: wrap; }
.more input { flex: 1 1 160px; padding: 7px 8px; font-size: 15px; }
.linkbtn { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12px; text-decoration: underline; padding: 0 2px; }
.person .line2 .iconbtn { width: 28px; height: 30px; font-size: 14px; }
.person .line2 .btn.small { padding: 6px 9px; font-size: 12px; }
.person .line2 .chip { padding: 5px 7px; font-size: 11px; }
.ptel { font-size: 12px; letter-spacing: -.01em; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; display: inline-flex; align-items: center; gap: 2px; }
.ptel a { color: var(--accent); text-decoration: none; }
.ptel .linkbtn { text-decoration: none; font-size: 13px; padding: 2px 3px; }
@media (max-width: 480px) { .person .line2 { padding-left: 0; gap: 5px; } .person .line2 .seg button { padding: 7px 7px; } }
.sublabel { font: 700 12px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--accent); padding-top: 4px; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 8px; width: 34px; height: 32px; font-size: 15px; }
.flag { padding-left: 30px; font-size: 13px; color: var(--warn); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.flag code { font-family: inherit; color: var(--muted); }
.stops { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.preview { overflow-x: auto; background: #fff; color: #000; border-radius: 8px; border: 1px solid var(--line); }
.preview table { border-collapse: collapse; font: 11px/1.25 Arial, sans-serif; min-width: 640px; width: 100%; }
.preview td { border: 1px solid #000; padding: 1px 4px; vertical-align: top; }
.preview .h { font-weight: 700; }
.preview .red { color: #f00; font-weight: 700; }
.preview mark { background: #ff0; color: #000; }
.preview td.off, .preview td.off .red, .preview .offt { color: #bfbfbf; }
.preview td.off .on { color: #000; }
.shotsrc table { border-collapse: separate; border-spacing: 0; border-top: 1px solid #000; border-left: 1px solid #000; }
.shotsrc td { border-width: 0 1px 1px 0; }
.preview .date { text-align: center; font: 13px Calibri, Arial, sans-serif; padding: 4px; }
.total { font-size: 17px; font-variant-numeric: tabular-nums; }
.fname { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; word-break: break-all; }
details > summary { cursor: pointer; font-weight: 600; }
.namerow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
.namerow input { flex: 1; min-width: 0; }
details.backup { margin-top: 12px; }
/* Компьютер: шире, крупнее, карточки в колонки. На телефоне ничего не меняется. */
@media (min-width: 1000px) {
  body { font-size: 16px; }
  .wrap { max-width: 1360px; padding-inline: 32px; }
  header.top { margin-inline: -32px; padding-inline: 32px; padding-block: 14px; }
  .top h1 { font-size: 22px; }
  .top .sub { font-size: 14px; }
  nav.tabs { grid-template-columns: repeat(5, minmax(120px, 180px)); justify-content: center; }
  nav.tabs button { font-size: 14px; padding: 14px 4px 16px; }
  section { gap: 18px; padding-top: 18px; }
  h2 { font-size: 17px; }
  .card { padding: 16px 18px; }
  .muted, .flag, .stops, .phone { font-size: 14px; }
  .btn.small { font-size: 14px; }
  .person .line1 { grid-template-columns: 28px 1.2fr 1fr 64px; }
  .person .line2, .flag, .phone, .more { padding-left: 34px; }
  /* «День»: две колонки, свёрнутые блоки — во всю ширину. */
  main[data-tab="day"] section { grid-template-columns: 1fr 1fr; align-items: start; }
  main[data-tab="day"] section > .card:has(> details) { grid-column: 1 / -1; }
  /* «Газели» и «Люди»: карточки газелей в 2–3 колонки, остальное во всю ширину. */
  main[data-tab="gaz"] section { grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); align-items: start; }
  main[data-tab="people"] section { grid-template-columns: repeat(auto-fill, minmax(460px, 1fr)); align-items: start; }
  main[data-tab="gaz"] section > :not(.gcard), main[data-tab="people"] section > :not(.gcard) { grid-column: 1 / -1; }
  main section:has(> .banner) { grid-template-columns: 1fr; }
  main[data-tab="files"] section, main[data-tab="issues"] section { max-width: 1100px; }
  .preview:not(.shotsrc) table { font-size: 13px; }
  .preview:not(.shotsrc) .date { font-size: 15px; }
}
.tally { display: flex; gap: 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.tally b { min-width: 24px; } .tally label { display: flex; align-items: center; gap: 6px; margin: 0; } .tally input { width: 64px; }
.tally .btn { margin-left: auto; } .tmonth { align-items: center; gap: 12px; }
.hist { display: flex; gap: 8px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; }
details.backup > summary { font-weight: 500; font-size: 14px; color: var(--muted, inherit); }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.banner { border: 1px dashed var(--accent); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; }
/* Кот сидит на поле даты; клики проходят сквозь него. */
.datecat { position: relative; }
.kot { position: absolute; right: 6px; bottom: 33px; width: 72px; height: auto; pointer-events: none; z-index: 1; filter: drop-shadow(0 2px 3px rgb(0 0 0 / .25)); }
@media (min-width: 1000px) { .kot { width: 100px; right: 44px; bottom: 34px; } }
/* Анимации: плавные, только если в системе не выключено движение. */
@media (prefers-reduced-motion: no-preference) {
  .btn, .seg button, .chip, .iconbtn, nav.tabs button { transition: background-color .25s, color .25s, box-shadow .25s, transform .2s; }
  .btn:active, .chip:active, .iconbtn:active, .seg button:active { transform: scale(.97); }
  nav.tabs button:active { transform: scale(.96); }
  main.enter .card, main.enter .banner { animation: rise .6s var(--ease) both; }
  main.enter section > :nth-child(2) { animation-delay: .06s; }
  main.enter section > :nth-child(3) { animation-delay: .12s; }
  main.enter section > :nth-child(4) { animation-delay: .18s; }
  main.enter section > :nth-child(n+5) { animation-delay: .24s; }
  .person.flash { animation: flash 3.5s linear; }
  .more .pphone { animation: fadein .45s var(--ease) both; }
  details.opening > :not(summary) { animation: rise .5s var(--ease) both; }
  main.enter .kot { animation: kotIn .8s cubic-bezier(.34, 1.4, .64, 1) .15s both; }
  input, select, textarea { transition: border-color .25s, background-color .25s; }
}
@keyframes rise { from { opacity: 0; transform: translateY(8px) scale(.99); } }
@keyframes fadein { from { opacity: 0; transform: translateY(-4px); } }
:root { --ease: cubic-bezier(.16, 1, .3, 1); }
@keyframes flash { 0%, 20% { background: var(--warn-bg); box-shadow: 0 0 0 6px var(--warn-bg); } }
/* Найденный поиском: держится секунду и плавно гаснет за 4 секунды. */
.person.found { animation: found 4s linear; }
@keyframes found { 0%, 25% { background: var(--warn-bg); box-shadow: 0 0 0 6px var(--warn-bg), 0 0 0 8px var(--warn); } }
@keyframes kotIn { from { opacity: 0; transform: translateY(10px) scale(.9); } }
.person { border-radius: 6px; }
</style>

<script>
(function () {
  'use strict';
  const C = window.Core;
  // Общая база для GitHub-сайта (Firebase). Эти данные не секретные: без пароля база никого не пускает.
  // email — общий логин бригады (пусто — спрашиваем на экране входа), пароль знают только свои.
  const FIREBASE = {
    email: 'zubiliha@gmail.com',
    config: {
      apiKey: 'AIzaSyBvkZ64XTdkfzZJ6duLnQywFmTobrb4nrU',
      authDomain: 'zubilikha.firebaseapp.com',
      projectId: 'zubilikha',
      storageBucket: 'zubilikha.firebasestorage.app',
      messagingSenderId: '1051256864141',
      appId: '1:1051256864141:web:442384f43c700f3fd851c4'
    }
  };
  const useFirebase = !!FIREBASE.config && !(window.claude && window.claude.use);
  const LOGIN_KEY = 'zubilikha_login';
  const KEY = 'zubilikha_day_v1';
  const TAB_KEY = 'zubilikha_tab';
  const $main = document.getElementById('main');

  // ---------- состояние ----------
  let day = load() || exampleDay();
  let tab = safeGet(TAB_KEY) || 'people';
  const openRows = new Set();
  // Строки, которые только что добавили, переложили или нашли поиском: подсвечиваются и плавно гаснут.
  // Помню время начала, чтобы перерисовка не обрывала подсветку, а продолжала её с того же места.
  const flashAt = {};
  const FLASH_MS = { flash: 3500, found: 4000 };
  function flash(id, cls, delay) { flashAt[id] = { t: Date.now() + (delay || 0), cls: cls || 'flash' }; }
  function flashAttr(id) {
    const f = flashAt[id];
    if (!f) return '';
    const age = Date.now() - f.t;
    if (age >= FLASH_MS[f.cls]) { delete flashAt[id]; return ''; }
    return ' ' + f.cls + '" style="animation-delay:' + (-age) + 'ms';
  }
  let shownTab = null;
  let parseReport = null;
  let assignReport = null;
  let pendingConfirm = null;
  let showBrig = false;

  // Тема: как в системе, светлая или тёмная (запоминается в этом браузере).
  const THEME_KEY = 'zubilikha_theme';
  let theme = safeGet(THEME_KEY) || 'auto';
  function setTheme(v) {
    theme = v;
    safeSet(THEME_KEY, v);
    if (v === 'auto') document.documentElement.removeAttribute('data-theme');
    else document.documentElement.setAttribute('data-theme', v);
  }
  setTheme(theme);

  function safeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* хранилище недоступно */ } }
  function load() {
    try { const s = localStorage.getItem(KEY); return s ? migrate(JSON.parse(s)) : null; } catch (e) { return null; }
  }
  function migrate(d) {
    const base = C.newDay();
    d = Object.assign({}, base, d);
    d.defaults = Object.assign({}, base.defaults, d.defaults || {});
    if (!d.namesV2) { d.latinNames = false; d.namesV2 = true; } // раньше по умолчанию была латиница
    d.gazelles = (d.gazelles || []).map(function (g) { return Object.assign(C.newGazelle(), g); });
    d.people = (d.people || []).map(function (p) { return Object.assign({ id: C.uid(), status: 'ok', flags: [], gazId: '', phone: '', kind: 'поле' }, p); });
    C.migrateReplace(d, C.parseStops(d.stopsText));
    return d;
  }
  function save() { safeSet(KEY, JSON.stringify(day)); snapshot(); autoKeep(); recordTally(); updateTop(); queueSync(); }

  // История дня на этом телефоне: копия перед опасными действиями, перед чужой большой правкой и раз в 15 минут.
  const HIST_KEY = 'zubilikha_history_v1';
  const HIST_MAX = 20;
  function loadHist() { try { return JSON.parse(localStorage.getItem(HIST_KEY) || '[]') || []; } catch (e) { return []; } }
  function keep(why, d) {
    d = d || day;
    if (!d || d.example || !(d.people || []).length) return;
    const h = loadHist();
    const json = JSON.stringify(d);
    if (h.length && JSON.stringify(h[h.length - 1].day) === json) return;
    // Кто работал: для автокопии и «перед правкой» — автор последней правки общего дня, иначе тот, кто на этом телефоне.
    const by = sync.on ? (/^(автокопия|перед правкой )/.test(why) ? sync.by || sync.me : sync.me) || '' : '';
    h.push({ at: Date.now(), why: why, by: by, day: JSON.parse(json) });
    while (h.length > HIST_MAX) h.shift();
    // Если память переполнена, выкидываю старые копии.
    while (h.length) { try { localStorage.setItem(HIST_KEY, JSON.stringify(h)); return; } catch (e) { h.shift(); } }
  }
  function autoKeep() {
    const h = loadHist();
    if (!h.length || Date.now() - h[h.length - 1].at > 15 * 60000) keep('автокопия');
  }
  // Чужая правка, после которой пропадает много людей или меняется дата.
  function bigDrop(before, after) {
    if (!before || before.example) return false;
    const n = function (d) { return (d.people || []).filter(function (p) { return p.status !== 'refused'; }).length; };
    return before.date !== after.date || n(after) < n(before) - 2;
  }

  // Телефонная книжка: номер запоминается по «Фамилия И» и живёт между днями.
  const BOOK_KEY = 'zubilikha_phones_v1';
  let book = {};
  try { book = JSON.parse(localStorage.getItem(BOOK_KEY) || '{}') || {}; } catch (e) { book = {}; }
  function bookKey(p) { return C.norm(C.personLabel(p)); }
  function saveBook() { safeSet(BOOK_KEY, JSON.stringify(book)); queueSync(); }
  function rememberPhone(p) {
    const k = bookKey(p);
    if (!k) return;
    if (p.phone) book[k] = p.phone; else delete book[k];
    saveBook();
  }
  function fillPhone(p) {
    if (!p.phone) { const k = bookKey(p); if (book[k]) p.phone = book[k]; }
  }

  // Метка «часто не выходит» тоже запоминается по «Фамилия И».
  const MARKS_KEY = 'zubilikha_marks_v1';
  let marks = {};
  try { marks = JSON.parse(localStorage.getItem(MARKS_KEY) || '{}') || {}; } catch (e) { marks = {}; }
  function isFlaky(p) { return !!marks[bookKey(p)]; }
  function setFlaky(p, v) {
    const k = bookKey(p);
    if (!k) return;
    if (v) marks[k] = true; else delete marks[k];
    safeSet(MARKS_KEY, JSON.stringify(marks));
    queueSync();
  }

  // Подсчёт за месяц: сколько газелей было у Димы и у Миши в каждый день. Общий для обоих, правится руками.
  const TALLY_KEY = 'zubilikha_tally_v1';
  let tally = {};
  try { tally = JSON.parse(localStorage.getItem(TALLY_KEY) || '{}') || {}; } catch (e) { tally = {}; }
  let tallyMonth = '', tallyNote = '', tallyOpen = false;
  function saveTally() { safeSet(TALLY_KEY, JSON.stringify(tally)); }
  // Текущий день записывается сам, пока его не поправили руками.
  function recordTally() {
    if (day.example || !/^\d{4}-\d{2}-\d{2}$/.test(day.date || '')) return;
    const t = C.vanTally(day), old = tally[day.date];
    if (old && old.manual) return;
    if (!t.d && !t.m) { if (old) { delete tally[day.date]; saveTally(); } return; }
    if (old && old.d === t.d && old.m === t.m) return;
    tally[day.date] = { d: t.d, m: t.m };
    saveTally();
  }

  // Настройки газелей по датам, чтобы взять «как в прошлый раз».
  const SET_KEY = 'zubilikha_settings_v1';
  function loadSnaps() { try { return JSON.parse(localStorage.getItem(SET_KEY) || '{}') || {}; } catch (e) { return {}; } }
  function snapshot() {
    if (day.example || !day.date) return;
    const snaps = loadSnaps();
    snaps[day.date] = {
      brigadier: day.brigadier, place: day.place, defaults: day.defaults, rate: day.rate,
      gazelles: day.gazelles.map(function (g) { return Object.assign({}, g, { contact: '' }); }),
    };
    Object.keys(snaps).sort().slice(0, -7).forEach(function (k) { delete snaps[k]; });
    safeSet(SET_KEY, JSON.stringify(snaps));
  }
  function prevSnap() {
    const snaps = loadSnaps();
    const dates = Object.keys(snaps).filter(function (k) { return k < day.date; }).sort();
    const k = dates[dates.length - 1];
    return k ? { date: k, s: snaps[k] } : null;
  }
  function applySnap(snap) {
    const s = snap.s;
    day.gazelles = s.gazelles.map(function (g) { return Object.assign(C.newGazelle(), g, { id: C.uid(), contact: '' }); });
    day.defaults = Object.assign({}, day.defaults, s.defaults || {});
    if (!String(day.brigadier || '').trim()) day.brigadier = s.brigadier || '';
    if (s.place) day.place = s.place;
    if (s.rate) day.rate = s.rate;
    day.people.forEach(function (p) { if (!gById(p.gazId)) p.gazId = ''; });
  }

  // «Что не так»: заметки со скриншотами, копятся и выгружаются одним файлом.
  const ISSUES_KEY = 'zubilikha_issues_v1';
  let issues = [];
  try { issues = JSON.parse(localStorage.getItem(ISSUES_KEY) || '[]') || []; } catch (e) { issues = []; }
  let issueDraft = { text: '', img: '' };
  let issueMsg = '';
  let lastTab = 'people';
  function saveIssues() {
    try { localStorage.setItem(ISSUES_KEY, JSON.stringify(issues)); return true; } catch (e) { return false; }
  }
  function queueIssues() { if (sync.on && !sync.readOnly) { clearTimeout(sync.timer); sync.timer = setTimeout(pushSync, 600); } }
  function dropIssues(f) {
    issues.forEach(function (x) { if (f(x) && (x.up || x.imgRemote)) isync.del.push(x.id); });
    issues = issues.filter(function (x) { return !f(x); });
    saveIssues(); queueIssues();
  }
  // В общей базе: список записей без картинок в shared/issues, каждый скриншот отдельным документом shared/issimg_<id>.
  const isync = { base: null, rev: null, del: [], loading: {} };
  function issueMeta(x) { return { at: x.at, text: x.text || '', by: x.by || '', ctx: x.ctx || {}, img: !!(x.img || x.imgRemote) }; }
  function issueItems() { const m = {}; issues.forEach(function (x) { m[x.id] = issueMeta(x); }); return m; }
  function onRemoteIssues(snap) {
    if (!snap.exists) { if (issues.length) queueSync(); return; }
    const d = snap.data();
    if (d.rev === isync.rev) return;
    const remote = d.items || {};
    const merged = C.mergeMap(isync.base || {}, issueItems(), remote);
    const old = {}; issues.forEach(function (x) { old[x.id] = x; });
    issues = Object.keys(merged).map(function (id) {
      const m = merged[id], x = old[id];
      return Object.assign({ id: id, img: '', up: true }, x || {}, { at: m.at, text: m.text, by: m.by, ctx: m.ctx, imgRemote: m.img && !(x && x.img) });
    }).sort(function (a, b) { return a.at < b.at ? -1 : a.at > b.at ? 1 : 0; });
    saveIssues();
    isync.base = JSON.parse(JSON.stringify(remote));
    isync.rev = d.rev;
    if (JSON.stringify(merged) !== JSON.stringify(remote)) queueSync();
    loadIssueImages();
    if (tab === 'issues') rerender();
  }
  // Скриншоты второго человека подтягиваю по одному и запоминаю, чтобы не читать базу заново.
  function loadIssueImages() {
    if (!sync.on || !sync.db) return;
    issues.forEach(function (x) {
      if (!x.imgRemote || x.img || isync.loading[x.id]) return;
      isync.loading[x.id] = true;
      sync.db.doc('shared/issimg_' + x.id).get().then(function (snap) {
        const img = snap.exists && snap.data().img;
        const y = issues.find(function (z) { return z.id === x.id; });
        if (img && y) { y.img = img; y.imgRemote = false; y.up = true; saveIssues(); if (tab === 'issues') rerender(); }
      }).catch(function () { /* попробую при следующем обновлении */ }).then(function () { delete isync.loading[x.id]; });
    });
  }
  async function pushIssues() {
    while (isync.del.length) {
      const id = isync.del[0];
      const ref = sync.db.doc('shared/issimg_' + id);
      await (ref.delete ? ref.delete() : ref.set({ img: '' }));
      isync.del.shift();
    }
    for (const x of issues) {
      if (x.img && !x.up) { await sync.db.doc('shared/issimg_' + x.id).set({ img: x.img, at: Date.now() }); x.up = true; saveIssues(); }
    }
    const snap = await sync.issuesRef.get();
    if (snap.exists && snap.data().rev !== isync.rev) onRemoteIssues(snap);
    const items = issueItems();
    if ((!snap.exists && issues.length) || (snap.exists && JSON.stringify(items) !== JSON.stringify(isync.base))) {
      const rev = C.uid() + C.uid();
      isync.rev = rev;
      await sync.issuesRef.set({ items: items, rev: rev, by: sync.me || '', at: Date.now() });
      isync.base = items;
    }
  }

  function exampleDay() {
    const d = C.newDay();
    d.example = true;
    const spec = [['457', 'Д', 19], ['601', 'М', 18], ['685', '', 5]];
    d.gazelles.forEach(function (g, i) { g.number = spec[i][0]; g.letter = spec[i][1]; g.capacity = spec[i][2]; });
    d.gazelles[1].kind = 'Цех/поле';
    d.gazelles[1].payShop = '3000';
    d.gazelles[2].vehicle = 'машина';
    d.gazelles[2].carName = 'тойота королла';
    d.gazelles[2].fuel = '1000';
    const names = ['Абрамов А', 'Белова Б', 'Воронин В', 'Гаврилова Г', 'Данилов Д', 'Ефимова Е', 'Жуков Ж', 'Зайцева З', 'Ильин И', 'Ковалева К',
      'Лаптев Л', 'Миронова М', 'Носков Н', 'Орлова О', 'Панов П', 'Рябова Р', 'Соколов С', 'Титова Т', 'Уткин У', 'Фомина Ф', 'Хохлов Х', 'Цветкова Ц'];
    const stops = ['Леспромхоз', 'Пурех 5ка', 'Рынок', '3шк', 'Художка', 'Стекляшка', 'Фрунзе/Пионерская', 'Шалдеж'];
    names.forEach(function (n, i) {
      const g = d.gazelles[i < 9 ? 0 : i < 17 ? 1 : 2];
      const st = i < 9 ? stops[i % 4] : stops[4 + (i % 4)];
      d.people.push({ id: C.uid(), surname: n.split(' ')[0], initial: n.split(' ')[1], stop: st, kind: i >= 9 && i < 12 ? 'цех' : 'поле', phone: i === 1 ? '+7 900 000-00-00' : '', gazId: g.id, status: i === 5 || i === 12 ? 'noshow' : 'ok', flags: [] });
    });
    d.people.filter(function (p) { return p.gazId === d.gazelles[2].id; })[0].driver = true;
    d.gazelles[0].contact = C.accusative('Данилов Д');
    d.zp = 'поле: ' + C.accusative('Белова Б');
    return d;
  }

  // ---------- помощники ----------
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function gById(id) { return day.gazelles.find(function (g) { return g.id === id; }); }
  function gTitle(g) {
    const i = day.gazelles.indexOf(g);
    if (g.vehicle === 'машина') return (i + 1) + '. ' + g.kind + ', ' + ((g.carName || 'машина') + ' ' + (g.number || '')).trim();
    return (i + 1) + '. ' + g.kind + (g.number ? ' №' + g.number : '') + (g.letter ? ' ' + g.letter : '') + (g.noOrder ? ' (заявки нет)' : '');
  }
  function gShort(g, gi) {
    return (gi + 1) + (g.vehicle === 'машина' ? 'М' : g.kind === 'Цех' ? 'Ц' : g.kind === 'Цех/поле' ? 'ЦП' : 'П');
  }
  function splitName(text) {
    const parts = String(text || '').trim().replace(/\./g, ' ').split(/\s+/).filter(Boolean);
    if (!parts.length) return { surname: '', initial: '' };
    const last = parts[parts.length - 1];
    if (parts.length > 1 && last.length === 1) return { surname: parts.slice(0, -1).join(' '), initial: last.toUpperCase() };
    return { surname: parts.join(' '), initial: '' };
  }
  function dateTitle() {
    const dp = C.dateParts(day.date);
    return dp ? dp.d + ' ' + C.MONTHS_GEN[dp.m - 1] : 'без даты';
  }
  let stopsCache = { text: null, list: [] };
  function stopsList() {
    if (stopsCache.text !== day.stopsText) stopsCache = { text: day.stopsText, list: C.parseStops(day.stopsText) };
    return stopsCache.list;
  }

  function updateTop() {
    if (login.need) { document.getElementById('title').textContent = 'Газели'; document.getElementById('subtitle').textContent = ''; return; }
    document.getElementById('title').textContent = (day.place || 'Газели') + ' · ' + dateTitle();
    const active = day.people.filter(function (p) { return p.status !== 'refused'; });
    const placed = active.filter(function (p) { return p.gazId; }).length;
    const cap = day.gazelles.reduce(function (s, g) { return s + (+g.capacity || 0); }, 0);
    const noshow = day.people.filter(function (p) { return p.status === 'noshow'; }).length;
    const reserve = active.filter(C.reserveKind).length;
    // Сколько ещё людей нужно найти: все места минус все, кто едет (и в газелях, и пока без газели), кроме замены.
    const left = cap - (active.length - reserve);
    const need = !cap ? '' : left > 0 ? ', осталось набрать ' + left + ' ' + (left % 10 === 1 && left % 100 !== 11 || [2, 3, 4].indexOf(left % 10) >= 0 && [12, 13, 14].indexOf(left % 100) < 0 ? 'человека' : 'человек')
      : left === 0 ? ', набрано полностью' : ', людей больше, чем мест, на ' + (-left);
    document.getElementById('subtitle').textContent =
      (String(day.brigadier || '').trim() ? 'Бригадир: ' + day.brigadier + ' · ' : '') + 'в газелях ' + placed + ' из ' + cap + ' мест' + need +
      (active.length - placed - reserve ? ' · без газели ' + (active.length - placed - reserve) : '') +
      (reserve ? ' · замена ' + reserve : '') +
      (noshow ? ' · не вышли ' + noshow : '') +
      (syncLine() ? '\n' + syncLine() : '');
  }

  // ---------- вкладки ----------
  document.getElementById('tabs').addEventListener('click', function (e) {
    const b = e.target.closest('button[data-tab]');
    if (!b) return;
    if (tab !== 'issues') lastTab = tab;
    tab = b.dataset.tab; safeSet(TAB_KEY, tab); pendingConfirm = null; render(); window.scrollTo(0, 0);
  });

  function render() {
    renderLater = false;
    document.querySelectorAll('#tabs button').forEach(function (b) {
      if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    if (login.need) { $main.innerHTML = loginHtml(); updateTop(); return; }
    const html = ({ day: renderDay, gaz: renderGaz, people: renderPeople, files: renderFiles, issues: renderIssues }[tab] || renderPeople)();
    // Карточки плавно появляются только при смене вкладки; обычная перерисовка после нажатия идёт без анимации.
    const entering = shownTab !== tab;
    shownTab = tab;
    // Раскрытые блоки («История дня», «Время, оплата, работа»…) остаются раскрытыми после перерисовки.
    const opened = entering ? [] : detailsKeys().filter(function (x) { return x.d.open; }).map(function (x) { return x.k; });
    $main.classList.remove('enter');
    $main.dataset.tab = tab;
    $main.innerHTML = (day.example ? exampleBanner() : '') + html;
    detailsKeys().forEach(function (x) { if (!x.d.open && opened.indexOf(x.k) >= 0) { x.d.dataset.kept = '1'; x.d.open = true; } });
    // Если таблица Word не влезла по ширине, говорю, что её можно листать: иначе кажется, что она обрезана.
    const pv = $main.querySelector('.preview'), hint = document.getElementById('scrollHint');
    if (pv && hint) hint.hidden = pv.scrollWidth <= pv.clientWidth;
    if (entering) { void $main.offsetWidth; $main.classList.add('enter'); }
    updateTop();
  }

  // Ключ блока — заголовок без цифр и скобок плюс номер среди одинаковых: «Время, оплата, работа#1».
  function detailsKeys() {
    const seen = {};
    return Array.prototype.map.call($main.querySelectorAll('details'), function (d) {
      const s = d.querySelector('summary');
      const t = s ? s.textContent.replace(/\([^)]*\)|\d/g, '').trim() : '';
      seen[t] = (seen[t] || 0) + 1;
      return { d: d, k: t + '#' + seen[t] };
    });
  }

  function exampleBanner() {
    return '<section><div class="banner"><div>Сейчас открыт <b>пример с выдуманными фамилиями</b>, чтобы было видно, как всё работает.</div>' +
      '<div class="row"><button class="btn primary" data-act="startOwn">Начать свой день</button></div></div></section>';
  }

  // ---------- День ----------
  function field(label, path, value, attrs) {
    return '<label>' + esc(label) + '<input data-path="' + path + '" value="' + esc(value) + '" ' + (attrs || '') + '></label>';
  }
  function renderDay() {
    const d = day.defaults;
    return '<section>' +
      '<div class="card"><h2>День</h2>' +
      '<div class="grid2">' +
      '<label class="datecat">Дата выезда<input type="date" data-path="date" value="' + esc(day.date) + '">' +
      '<img class="kot" src="icons/kot.webp" alt="" aria-hidden="true" width="240" height="186"></label>' +
      field('Место (для имени файла)', 'place', day.place) +
      '</div>' + '<div class="grid2">' + field('Нам за человека, ₽', 'rate', day.rate, 'inputmode="numeric"') + '</div>' +
      (showBrig || String(day.brigadier || '').trim()
        ? '<div class="row"><label class="grow">Бригадир (в Excel и именах файлов)<input data-path="brigadier" value="' + esc(day.brigadier) + '" autocomplete="off"></label>' +
          '<button class="btn small" data-act="brigDel" style="align-self:end">Убрать</button></div>'
        : '<div class="row"><button class="btn small" data-act="brigAdd">Добавить бригадира</button></div>') +
      '<div class="row"><span class="muted">Тема</span><div class="seg" role="group" aria-label="Тема">' +
      [['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].map(function (t) {
        return '<button data-act="theme" data-v="' + t[0] + '" aria-pressed="' + (theme === t[0]) + '">' + t[1] + '</button>';
      }).join('') + '</div></div>' +
      '</div>' +
      '<div class="card"><h2>Для всех газелей</h2><div class="muted">В карточке газели можно поменять для неё отдельно.</div>' +
      '<div class="grid3">' +
      field('Выезд в', 'defaults.departure', d.departure, 'inputmode="decimal"') +
      field('Оплата', 'defaults.pay', d.pay, 'inputmode="numeric"') +
      field('Оплата цех', 'defaults.payShop', d.payShop, 'inputmode="numeric" placeholder="как поле"') +
      field('Начало', 'defaults.start', d.start) +
      field('Конец', 'defaults.end', d.end) +
      '</div>' +
      '<div class="grid2">' + field('Вид работы', 'defaults.work', d.work) + field('Вид работы цех', 'defaults.workShop', d.workShop, 'placeholder="как поле"') + '</div>' +
      field('Напоминание (красным)', 'defaults.reminder', d.reminder) +
      '</div>' +

      syncCard() +
      dayFileCard() + historyCard() + bkCard() +
      '<div class="card"><details><summary>Справочник остановок</summary>' +
      '<p class="muted">Одна строка — одна остановка. Первое слово — как писать в файле, дальше через запятую варианты из ВК. Строка с # — начало зоны: по зонам раскладываются газели. Зона, где в названии есть «деревни» или «любую», идёт в любую газель. Порядок строк — порядок маршрута и сводки.</p>' +
      '<textarea data-path="stopsText" rows="16" spellcheck="false">' + esc(day.stopsText) + '</textarea>' +
      '<label class="row" style="display:flex"><input type="checkbox" data-path="latinNames" style="width:auto" ' + (day.latinNames ? 'checked' : '') + '> Имена файлов латиницей</label>' +
      '</details></div>' +
      '</section>';
  }

  // Когда день общий, файл не нужен: остаётся «Новый день» и мелкая резервная копия.
  function dayFileCard() {
    const files = '<div class="row"><button class="btn" data-act="exportJson">Сохранить день в файл</button><button class="btn" data-act="importJson">Открыть файл дня</button></div>';
    if (sync.on) {
      return '<div class="card"><h2>Новый день</h2>' +
        confirmBlock('newDay', 'Новый день', 'Список людей очистится у всех, кто вошёл: газели и настройки останутся, дата сдвинется на следующий день.', 'Очистить список') +
        '<details class="backup"><summary>Резервная копия файлом</summary>' +
        '<div class="muted">Вся общая база одним файлом: день, телефоны и отметки. На случай, если база не откроется.</div>' + files + '</details>' +
        '</div>';
    }
    return '<div class="card"><h2>Файл дня</h2>' +
      '<div class="muted">День хранится в этом браузере. Чтобы передать его второму человеку или сохранить копию, сохраните в файл. В файл попадает и телефонная книжка (запомнено номеров: ' + Object.keys(book).length + ').</div>' +
      files +
      confirmBlock('newDay', 'Новый день', 'Список людей очистится, газели и настройки останутся. Дата сдвинется на следующий день.', 'Очистить список') +
      '</div>';
  }

  function historyCard() {
    const h = loadHist();
    if (!h.length) return '';
    const rows = h.map(function (x, i) { return { x: x, i: i }; }).reverse().map(function (r) {
      const x = r.x, i = r.i;
      const n = (x.day.people || []).filter(function (p) { return p.status !== 'refused'; }).length;
      const dp = C.dateParts(x.day.date);
      const who = whoName(x.by, false);
      const info = fmtAt(new Date(x.at).toISOString()) + (who ? ' · ' + esc(who) : '') + ' · ' + esc(x.why) + ' · день ' + (dp ? C.pad2(dp.d) + '.' + C.pad2(dp.m) : '?') + ', ' + n + ' чел.';
      if (pendingConfirm === 'histBack' + i) {
        return '<div class="hist"><div>' + info + '</div><div class="note">Текущий день заменится этой копией' + (sync.on ? ' у всех, кто вошёл' : '') + '. Сам текущий день тоже сохранится в истории.</div>' +
          '<div class="confirm"><button class="btn danger" data-act="histBack" data-i="' + i + '" data-yes="1">Вернуть</button><button class="btn" data-act="cancelConfirm">Отмена</button></div></div>';
      }
      return '<div class="hist"><div>' + info + '</div><button class="btn small" data-act="histBack" data-i="' + i + '">Вернуть как было</button></div>';
    }).join('');
    return '<div class="card"><details' + (/^histBack/.test(pendingConfirm || '') ? ' open' : '') + '><summary>История дня (' + h.length + ')</summary>' +
      '<div class="muted">Копии хранятся на этом телефоне: перед «Новый день», открытием файла, раскладкой заново, удалением, перед большой правкой второго человека и раз в 15 минут.</div>' +
      rows + '</details></div>';
  }

  function confirmBlock(act, label, text, yes) {
    if (pendingConfirm === act) {
      return '<div class="note">' + esc(text) + '</div><div class="confirm"><button class="btn danger" data-act="' + act + '" data-yes="1">' + esc(yes) + '</button><button class="btn" data-act="cancelConfirm">Отмена</button></div>';
    }
    return '<div class="row"><button class="btn danger" data-act="' + act + '">' + esc(label) + '</button></div>';
  }

  function peopleOptions(g) {
    return day.people.filter(function (p) { return p.status !== 'refused' && (!g || p.gazId === g.id); })
      .map(function (p) { return '<option value="' + p.id + '">' + esc(C.personLabel(p)) + '</option>'; }).join('');
  }

  // ---------- Газели ----------
  function renderGaz() {
    const d = day.defaults;
    let h = '<section>';
    const ps = prevSnap();
    if (ps) {
      const dp = C.dateParts(ps.date);
      h += '<div class="card"><div class="row"><div class="grow muted">Газели, оплата и время с ' + C.pad2(dp.d) + '.' + C.pad2(dp.m) + ': ' +
        ps.s.gazelles.length + ' шт.</div>' +
        (pendingConfirm === 'useSnap'
          ? '<button class="btn primary small" data-act="useSnap" data-yes="1">Заменить текущие</button><button class="btn small" data-act="cancelConfirm">Отмена</button>'
          : '<button class="btn small" data-act="useSnap">Как в прошлый раз</button>') +
        '</div></div>';
    }
    h += sortCard();
    day.gazelles.forEach(function (g, i) {
      const n = C.peopleOf(day, g).length;
      const over = n > (+g.capacity || 0);
      const pre = 'gazelles.' + i + '.';
      h += '<div class="card gcard">' +
        '<div class="ghead"><h2>' + esc(gTitle(g)) + '</h2><span class="count' + (over ? ' over' : '') + '">' + n + ' / ' + (+g.capacity || 0) + '</span></div>' +
        '<div class="row"><div class="seg" role="group" aria-label="Куда едет">' +
        ['Поле', 'Цех', 'Цех/поле'].map(function (k) { return '<button data-act="gKind" data-i="' + i + '" data-v="' + k + '" aria-pressed="' + (g.kind === k) + '">' + k + '</button>'; }).join('') +
        '</div><div class="seg" role="group" aria-label="Транспорт">' +
        ['газель', 'машина'].map(function (k) { return '<button data-act="gVehicle" data-i="' + i + '" data-v="' + k + '" aria-pressed="' + ((g.vehicle || 'газель') === k) + '">' + (k === 'газель' ? 'Газель' : 'Машина') + '</button>'; }).join('') +
        '</div><span class="grow"></span>' +
        '<button class="iconbtn" data-act="gUp" data-i="' + i + '" aria-label="Выше">↑</button>' +
        '<button class="iconbtn" data-act="gDown" data-i="' + i + '" aria-label="Ниже">↓</button></div>' +
        '<div class="grid3">' +
        (g.vehicle === 'машина'
          ? field('Марка', pre + 'carName', g.carName, 'placeholder="тойота королла"') + field('Номер', pre + 'number', g.number, 'inputmode="numeric"')
          : field('Номер', pre + 'number', g.number, 'inputmode="numeric"') +
            '<div class="lbl">Чья<div class="seg owner" role="group" aria-label="Чья газель">' + ['М', 'Д'].map(function (k) {
              return '<button data-act="gLetter" data-i="' + i + '" data-v="' + k + '" aria-pressed="' + (C.owner(g) === k) + '" title="' + (k === 'М' ? 'Миша' : 'Дима') + '">' + k + '</button>';
            }).join('') + '</div></div>') +
        field('Мест', pre + 'capacity', g.capacity, 'type="number" inputmode="numeric" min="1"') +
        '</div>' +
        (g.kind === 'Цех' && g.vehicle !== 'машина'
          ? '<div class="row"><button class="chip" data-act="gNoOrder" data-i="' + i + '" aria-pressed="' + !!g.noOrder + '">' + (g.noOrder ? '✓ заявки в цех пока нет' : 'Заявки в цех пока нет') + '</button>' +
            (g.noOrder ? '<span class="muted">В Word бледным списком, в Excel не попадёт.</span>' : '') + '</div>'
          : '') +
        '<details><summary>Время, оплата, работа' + (['departure', 'pay', 'payShop', 'start', 'end', 'work', 'workShop', 'reminder'].some(function (k) { return String(g[k] || '').trim(); }) ? ' (изменено)' : '') + '</summary>' +
        '<div class="grid3" style="margin-top:10px">' +
        field('Выезд в', pre + 'departure', g.departure, 'placeholder="' + esc(d.departure) + '"') +
        field(g.kind === 'Поле' ? 'Оплата' : 'Оплата поле', pre + 'pay', g.pay, 'placeholder="' + esc(d.pay) + '"') +
        (g.kind !== 'Поле' ? field('Оплата цех', pre + 'payShop', g.payShop, 'placeholder="' + esc(d.payShop || d.pay) + '"') : '') +
        field('Начало', pre + 'start', g.start, 'placeholder="' + esc(d.start) + '"') +
        field('Конец', pre + 'end', g.end, 'placeholder="' + esc(d.end) + '"') +
        '</div>' +
        field(g.kind === 'Поле' ? 'Вид работы' : 'Вид работы поле', pre + 'work', g.work, 'placeholder="' + esc(d.work) + '"') +
        (g.kind !== 'Поле' ? field('Вид работы цех', pre + 'workShop', g.workShop, 'placeholder="' + esc(d.workShop || d.work) + '"') : '') +
        field('Напоминание', pre + 'reminder', g.reminder, 'placeholder="' + esc(d.reminder) + '"') +
        '<div class="muted">Пустое поле = как для всех газелей.</div>' +
        '</details>' +
        (g.vehicle === 'машина'
          ? '<div class="grid2">' + field('Бензин водителю, ₽', pre + 'fuel', g.fuel, 'inputmode="numeric" placeholder="1000"') +
            '<div class="muted" style="align-self:end">Добавится водителю в Excel.</div></div>'
          : field('По остановкам прошу отписаться –', pre + 'contact', g.contact) +
            '<label>Выбрать из этой газели<select data-act="gContact" data-i="' + i + '"><option value="">выбрать…</option>' + peopleOptions(g) + '</select></label>') +
        (pendingConfirm === 'gDel' + i
          ? '<div class="note">Люди из этой газели перейдут в «Без газели».</div><div class="confirm"><button class="btn danger" data-act="gDel" data-i="' + i + '" data-yes="1">Удалить газель</button><button class="btn" data-act="cancelConfirm">Отмена</button></div>'
          : '<div class="row"><button class="btn danger small" data-act="gDel" data-i="' + i + '">Удалить газель</button></div>') +
        '</div>';
    });
    h += '<div class="row"><button class="btn primary" data-act="gAdd">Добавить газель</button><button class="btn" data-act="gAddCar">Добавить машину</button></div>';
    h += '<div class="card"><h2>Низ таблицы</h2>' +
      field('ЗП поле/цех прошу получить/выдать –', 'zp', day.zp) +
      field('Приписка (курсивом)', 'footer', day.footer) +
      '</div></section>';
    return h;
  }

  // ---------- Люди ----------
  // Поиск человека по фамилии: список совпадений с газелью и местом, нажатие — прокрутка к нему.
  let searchQ = '';
  function searchResults() {
    const q = C.norm(searchQ);
    if (!q) return '';
    const found = day.people.filter(function (p) { return C.norm(C.personLabel(p)).indexOf(q) >= 0; }).slice(0, 8);
    if (!found.length) return '<div class="muted">Никого не нашёл.</div>';
    return found.map(function (p) {
      const g = gById(p.gazId);
      const where = p.status === 'refused' ? 'отказ' : g ? gTitle(g) + ', место ' + (C.peopleOf(day, g).indexOf(p) + 1) : C.reserveKind(p) ? 'замена ' + C.reserveKind(p) : 'без газели';
      return '<button class="btn small" data-act="pFind" data-id="' + p.id + '">' + esc(C.personLabel(p)) + ' · ' + esc(where) + '</button>';
    }).join('');
  }
  function searchCard() {
    if (!day.people.length) return '';
    return '<div class="card"><h2>Найти человека</h2>' +
      '<input id="pSearch" type="search" placeholder="Фамилия" autocomplete="off" value="' + esc(searchQ) + '">' +
      '<div id="pSearchRes" class="row">' + searchResults() + '</div></div>';
  }

  function renderPeople() {
    const stops = stopsList();
    let h = '<section>' + searchCard();
    h += '<div class="card"><h2>Вставить из ВК</h2>' +
      '<div class="muted">Скопируйте сообщения из чата целиком. Возьму строки с датой ' + esc(dateShort()) + ' и записи без даты вроде «Иванова А Рынок цех» (их помечу ⚠, проверьте). Остальное пропущу.</div>' +
      '<textarea id="vkText" placeholder="12.10 Иванова А Рынок поле">' + esc(vkDraft) + '</textarea>' +
      '<div class="row"><button class="btn primary" data-act="parse">Разобрать</button>' + (vkDraft ? '<button class="btn" data-act="vkClear">Очистить</button>' : '') + '</div>' +
      (parseReport ? parseReport : '') +
      '</div>';

    const groups = day.gazelles.map(function (g) { return { g: g, list: C.peopleOf(day, g) }; });
    const none = day.people.filter(function (p) { return !gById(p.gazId) && !C.reserveKind(p) && p.status !== 'refused'; });
    const refused = day.people.filter(function (p) { return p.status === 'refused'; });

    if (day.people.some(function (p) { return p.status !== 'refused'; })) h += assignCard(none.length);
    h += sortCard();

    if (none.length || !day.people.length) {
      h += '<div class="card gcard"><div class="ghead"><h2>Без газели</h2><span class="count">' + none.length + '</span></div>';
      if (none.length) {
        h += '<div class="row"><button class="btn small" data-act="sortAlpha" data-g="">А–Я</button><select class="grow" data-act="moveAll"><option value="">Перенести всех в…</option>' +
          day.gazelles.map(function (g) { return '<option value="' + g.id + '">' + esc(gTitle(g)) + '</option>'; }).join('') +
          '<option value="replace">Замену (поле и цех по человеку)</option></select></div>';
      } else {
        h += '<div class="muted">Пока никого. Вставьте сообщения из ВК выше или добавьте человека вручную.</div>';
      }
      h += none.map(function (p, i) { return personRow(p, i + 1); }).join('');
      h += '<div class="row"><button class="btn small" data-act="pAdd" data-g="">Добавить человека</button></div></div>';
    }

    groups.forEach(function (x) {
      const cap = +x.g.capacity || 0;
      const n = x.list.length;
      const sum = C.stopSummary(day, x.g, stops).map(function (s) { return esc(s.stop) + ' — ' + s.count; }).join(' · ');
      h += '<div class="card gcard"><div class="ghead"><h2>' + esc(gTitle(x.g)) + '</h2><span class="count' + (n > cap ? ' over' : '') + '">' + n + ' / ' + cap +
        (n < cap ? ' · своб. ' + (cap - n) : n > cap ? ' · лишних ' + (n - cap) : '') + '</span></div>' +
        (sum ? '<div class="stops">' + sum + '</div>' : '') +
        seatHint(x.g, n, cap, stops) +
        (n > 1 ? '<div class="row"><button class="btn small" data-act="sortAlpha" data-g="' + x.g.id + '">По алфавиту</button><button class="btn small" data-act="sortAlpha" data-g="' + x.g.id + '" data-v="stop">По остановкам</button></div>' : '') +
        x.list.map(function (p, i) {
          let label = '';
          if (x.g.kind === 'Цех/поле') {
            const k = C.kindOf(x.g, p);
            if (i === 0 || C.kindOf(x.g, x.list[i - 1]) !== k) label = '<div class="sublabel">' + (k === 'Цех' ? 'Цех' : 'Поле') + '</div>';
          }
          return label + personRow(p, i + 1);
        }).join('') +
        '<div class="row"><button class="btn small" data-act="pAdd" data-g="' + x.g.id + '">Добавить человека</button></div></div>';
    });

    // Замена — такие же списки, как газели: остановка, статус, перенос в газель выбором.
    [['поле', 'Замена поле'], ['цех', 'Замена цех']].forEach(function (r) {
      const list = C.reserveOf(day, r[0]);
      h += '<div class="card gcard"><div class="ghead"><h2>' + r[1] + '</h2><span class="count">' + list.length + '</span></div>' +
        (list.length > 1 ? '<div class="row"><button class="btn small" data-act="sortAlpha" data-g="" data-r="' + r[0] + '">По алфавиту</button><button class="btn small" data-act="sortAlpha" data-g="" data-r="' + r[0] + '" data-v="stop">По остановкам</button></div>' : '') +
        (list.length ? '' : '<div class="muted">Пока никого. Перенести сюда можно выбором «→ ' + r[1] + '» у человека.</div>') +
        list.map(function (p, i) { return personRow(p, i + 1); }).join('') +
        '<div class="row"><button class="btn small" data-act="pAdd" data-g="" data-r="' + r[0] + '">Добавить человека</button></div></div>';
    });

    if (refused.length) {
      h += '<div class="card"><details><summary>Отказались (' + refused.length + ')</summary><div style="display:grid;gap:10px;margin-top:10px">' +
        refused.map(function (p, i) { return personRow(p, i + 1); }).join('') + '</div></details></div>';
    }
    h += '<datalist id="stopNames">' + stops.map(function (s) { return '<option value="' + esc(s.name) + '">'; }).join('') + '</datalist>';
    return h + '</section>';
  }

  // Порядок людей во всех газелях сразу (так же выйдет в Word).
  function sortCard() {
    if (!day.people.length) return '';
    const seated = day.people.some(function (p) { return p.gazId && p.status !== 'refused'; });
    // «Очистить все газели» стоит отдельно в правом верхнем углу, подальше от сортировки.
    return '<div class="card"><div class="sorthead"><div class="muted">' + (seated ? 'Порядок людей в Word, во всех газелях' : '') + '</div>' +
      (pendingConfirm === 'clearAll' ? '' : '<button class="btn small danger" data-act="clearAll">Очистить все газели</button>') + '</div>' +
      (pendingConfirm === 'clearAll'
        ? '<div class="note">Убрать всех людей (' + day.people.length + ') из газелей и из «Без газели»?' + (sync.on ? ' Список очистится у обоих.' : '') + ' Газели, дата и настройки останутся. Копия сохранится в «Истории дня» на вкладке «День».</div>' +
          '<div class="confirm"><button class="btn danger" data-act="clearAll" data-yes="1">Очистить</button><button class="btn" data-act="cancelConfirm">Отмена</button></div>'
        : '') +
      (seated && pendingConfirm !== 'clearAll' ? '<div class="row">' +
      '<button class="btn small" data-act="sortAll" data-v="name">Сортировать по фамилиям</button>' +
      '<button class="btn small" data-act="sortAll" data-v="stop">Сортировать по остановкам</button></div>' : '') +
      '</div>';
  }

  // Карточка автораспределения по зонам из справочника остановок.
  function assignCard(noneCount) {
    const vans = day.gazelles.filter(function (g) { return g.vehicle !== 'машина'; });
    const inVans = day.people.some(function (p) { return p.status !== 'refused' && vans.some(function (g) { return g.id === p.gazId; }); });
    let h = '<div class="card"><h2>Распределить по газелям</h2>';
    if (!vans.length) return h + '<div class="muted">Сначала добавьте газели на вкладке «Газели».</div></div>';
    h += '<div class="muted">По зонам из справочника остановок: каждая зона в свою газель, деревни вместе, цех в цеховую или сборную. Машины не трогаю. Потом можно поправить руками.</div>';
    if (pendingConfirm === 'assignAll') {
      h += '<div class="note">Все люди в газелях будут разложены заново, ручные перестановки пропадут.</div>' +
        '<div class="confirm"><button class="btn danger" data-act="assign" data-v="all" data-yes="1">Разложить всех заново</button><button class="btn" data-act="cancelConfirm">Отмена</button></div>';
    } else if (inVans) {
      h += '<div class="row">' + (noneCount ? '<button class="btn primary" data-act="assign" data-v="free">Разложить тех, кто без газели (' + noneCount + ')</button>' : '') +
        '<button class="btn" data-act="assign" data-v="all">Всех заново</button></div>';
    } else {
      h += '<div class="row"><button class="btn primary" data-act="assign" data-v="all">Разложить</button></div>';
    }
    return h + (assignReport || '') + '</div>';
  }

  function assignSummary(r) {
    const lines = r.vans.map(function (v) {
      const n = C.peopleOf(day, v.g).length;
      const z = v.zones.map(function (x) { return esc(x.zone.replace(/:.*/, '')) + ' — ' + x.count; }).join(', ');
      return '<li>' + esc(gTitle(v.g)) + ': ' + (n ? n + ' чел.' + (z ? ' (' + z + ')' : '') : 'пустая, можно убрать') +
        (v.zones.filter(function (x) { return !/деревн|любую/i.test(x.zone); }).length > 1 ? ' <b>— тут разные зоны</b>' : '') + '</li>';
    });
    let h = '<div class="note">Разложил ' + r.placed + ' чел.<ul>' + lines.join('') + '</ul>';
    if (r.left.length) {
      const shop = r.left.filter(function (p) { return p.kind === 'цех'; }).length;
      const noShopVan = !day.gazelles.some(function (g) { return g.vehicle !== 'машина' && (g.kind === 'Цех' || g.kind === 'Цех/поле'); });
      h += '<b>Не хватило мест: ' + r.left.length + ' чел.</b> Они в «Без газели».' +
        (shop && noShopVan ? ' Для цеха нет газели «Цех» или «Цех/поле».' : ' Добавьте газель или машину.');
    }
    return h + '</div>';
  }

  function dateShort() { const dp = C.dateParts(day.date); return dp ? C.pad2(dp.d) + '.' + C.pad2(dp.m) : ''; }

  // Телефон стоит в строке статуса, справа, рядом с «Удалить», чтобы строка человека не росла в высоту.
  function phoneInline(p) {
    if (!p.phone || openRows.has(p.id)) return '';
    return '<span class="ptel"><a href="tel:' + esc(String(p.phone).replace(/[^\d+]/g, '')) + '">' + esc(p.phone) + '</a>' +
      '<button class="linkbtn" data-act="pPhone" data-id="' + p.id + '" aria-label="Изменить телефон" title="Изменить телефон">✎</button></span>';
  }

  // Кто-то из газели отказался и есть свободные места: кого можно посадить.
  // Сначала те, кто без газели, с той же остановки, потом из той же зоны; если таких нет — лишние из переполненных газелей.
  function seatHint(g, n, cap, stops) {
    const free = cap - n;
    if (free <= 0 || g.vehicle === 'машина') return '';
    const gone = day.people.filter(function (p) { return p.gazId === g.id && p.status === 'refused'; });
    if (!gone.length) return '';
    const fits = function (p) { return g.kind === 'Цех/поле' || (g.kind === 'Цех') === (p.kind === 'цех'); };
    const goneStops = gone.map(function (p) { return p.stop; });
    const goneZones = gone.map(function (p) { const si = C.stopInfo(p.stop, stops); return si ? si.zone : ''; }).filter(Boolean);
    const rank = function (p) {
      if (goneStops.indexOf(p.stop) >= 0) return 0;
      const si = C.stopInfo(p.stop, stops);
      return si && goneZones.indexOf(si.zone) >= 0 ? 1 : 2;
    };
    let cands = day.people.filter(function (p) { return !gById(p.gazId) && p.status !== 'refused' && fits(p); });
    let from = '';
    if (!cands.length) {
      day.gazelles.forEach(function (o) {
        if (o === g || o.vehicle === 'машина') return;
        const list = C.peopleOf(day, o);
        const extra = list.length - (+o.capacity || 0);
        if (extra > 0) cands = cands.concat(list.slice(-extra).filter(fits));
      });
      from = ' из переполненных газелей';
    }
    if (!cands.length) return '';
    cands = cands.map(function (p, i) { return { p: p, r: rank(p), i: i }; })
      .sort(function (a, b) { return a.r - b.r || a.i - b.i; }).slice(0, 6).map(function (x) { return x.p; });
    return '<div class="note">Отказ: ' + esc(gone.map(C.personLabel).join(', ')) + '. Свободно мест: ' + free + '. Можно посадить' + from + ':' +
      '<div class="row">' + cands.map(function (p) {
        return '<button class="btn small" data-act="pSeat" data-id="' + p.id + '" data-g="' + g.id + '">+ ' + esc(C.personLabel(p)) + (p.stop ? ' · ' + esc(p.stop) : '') + '</button>';
      }).join('') + '</div></div>';
  }

  function personRow(p, n) {
    const flags = (p.flags || []).length
      ? '<div class="flag">⚠ ' + esc(p.flags.join('; ')) + (p.raw ? ' <code>«' + esc(p.raw) + '»</code>' : '') +
        ' <button class="btn small" data-act="pOk" data-id="' + p.id + '">Всё верно</button></div>'
      : '';
    const sug = p.stop ? C.suggestStop(p.stop, stopsList()) : null;
    const stopHint = sug
      ? '<div class="flag">Остановки «' + esc(p.stop) + '» нет в справочнике. <button class="btn small" data-act="pStopFix" data-id="' + p.id + '" data-v="' + esc(sug) + '">Может, ' + esc(sug) + '?</button></div>'
      : '';
    const st = p.status || 'ok';
    const g = gById(p.gazId);
    const inCar = !!g && g.vehicle === 'машина';
    const rk = C.reserveKind(p);
    return '<div class="person ' + st + flashAttr(p.id) + '" data-id="' + p.id + '">' +

  // Уменьшает скриншот, чтобы записи помещались в память браузера.
  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = function () {
        // Не больше ~150 КБ: столько спокойно влезает в общую базу.
        let out = '';
        [[1100, .72], [900, .65], [750, .6], [600, .55], [480, .5]].some(function (v) {
          const k = Math.min(1, v[0] / Math.max(img.width, img.height));
          const cv = document.createElement('canvas');
          cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
          cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
          out = cv.toDataURL('image/jpeg', v[1]);
          return out.length < 200000;
        });
        URL.revokeObjectURL(url);
        resolve(out);
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('не картинка')); };
      img.src = url;
    });
  }

  // Правки сливаются: если двое поменяли разное, сохраняется и то и другое (Core.mergeDay).
  const sync = {

  // Пока человек печатает, чужие правки не перерисовывают поле под пальцем — покажу после.
  function rerender() { if (editing()) renderLater = true; else render(); }
