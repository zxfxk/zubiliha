  async function initSync() {
    if (!(window.claude && window.claude.use)) return;
    const db = await window.claude.use('db').catch(function () { return null; });
    if (!db) return;
    sync.user = await window.claude.use('user').catch(function () { return null; });
    if (sync.user) {
      try { sync.me = await sync.user.id(); } catch (e) { sync.me = null; }
      try { if ((await sync.user.can('data.write')) === false) sync.readOnly = true; } catch (e) { /* не сказали — решит запись */ }
    }
    startSync(db, 'claude');
  }
  function startSync(db, mode) {
    if (sync.on) return;
    sync.on = true; sync.mode = mode; sync.err = '';
    sync.dayRef = db.doc('shared/day');
    sync.bookRef = db.doc('shared/book');
    sync.issuesRef = db.doc('shared/issues'); sync.db = db;
    sync.unsub = [sync.dayRef.onSnapshot(onRemoteDay, onSyncError), sync.bookRef.onSnapshot(onRemoteBook, onSyncError), sync.issuesRef.onSnapshot(onRemoteIssues, onSyncError)];
    rerender();
    // Недельную копию делаю чуть погодя, когда день уже подтянулся.
    setTimeout(bkAuto, 5000);
  }
  function stopSync() {
    (sync.unsub || []).forEach(function (f) { try { f(); } catch (e) { /* уже отписано */ } });
    sync.unsub = []; sync.on = false; sync.base = null; sync.rev = null; sync.bookBase = null; sync.bookRev = null; isync.base = null; isync.rev = null;
    clearTimeout(sync.timer); bk.list = null;
  }
  function onSyncError(e) {
    const code = e && e.code;
    sync.err = code === 'revoked' ? 'Доступ к общему дню закрыт.'
      : code === 'permission-denied' ? 'База не пускает. Проверьте правила доступа в Firestore.'
      : 'Общий день не обновляется. Перезагрузите страницу.';
    rerender();
  }

  // ---------- Вход на GitHub-сайте (Firebase) ----------
  const NAME_KEY = 'zubilikha_myname';
  let fb = null;
  const login = { need: useFirebase, checking: useFirebase, err: '', busy: false };
  function loadScript(src) {
    return new Promise(function (res, rej) {
      const el = document.createElement('script');
      el.src = src; el.onload = res; el.onerror = function () { rej(new Error(src)); };
      document.head.appendChild(el);
    });
  }
  async function initFirebase() {
    if (!useFirebase) return;
    try {
      for (const f of ['app', 'auth', 'firestore']) await loadScript('vendor/firebase/firebase-' + f + '-compat.js');
      window.firebase.initializeApp(FIREBASE.config);
      fb = { auth: window.firebase.auth(), db: window.firebase.firestore() };
    } catch (e) {
      login.checking = false; login.err = 'Не загрузилась общая база. Проверьте интернет и обновите страницу.'; render(); return;
    }
    fb.auth.onAuthStateChanged(function (u) {
      login.checking = false;
      login.need = !u;
      if (u) { sync.me = safeGet(NAME_KEY) || ''; startSync(fb.db, 'firebase'); } else stopSync();
      render();
    });
  }
  async function doLogin() {
    const pw = document.getElementById('loginPw');
    const nm = document.getElementById('loginName');
    if (nm && nm.value.trim()) safeSet(NAME_KEY, nm.value.trim());
    const em = document.getElementById('loginEmail');
    const email = FIREBASE.email || (em && em.value.trim()) || '';
    if (em && email) safeSet(LOGIN_KEY, email);
    if (!email) { login.err = 'Введите почту.'; render(); return; }
    if (!fb || !pw || !pw.value) { login.err = 'Введите пароль.'; render(); return; }
    login.busy = true; login.err = ''; render();
    try { await fb.auth.signInWithEmailAndPassword(email, pw.value); }
    catch (e) {
      const c = (e && e.code) || '';
      login.err = /wrong-password|invalid-credential|invalid-login|user-not-found|invalid-email/.test(c) ? (FIREBASE.email ? 'Неверный пароль.' : 'Неверная почта или пароль.')
        : /too-many-requests/.test(c) ? 'Слишком много попыток. Подождите несколько минут.'
        : /network/.test(c) ? 'Нет интернета.' : 'Не получилось войти: ' + (e && e.message || c);
    }
    login.busy = false; render();
  }
  async function doLogout() {
    if (!fb) return;
    await fb.auth.signOut();
    // На чужом телефоне после выхода ничего не остаётся.
    try { [KEY, BOOK_KEY, MARKS_KEY, HIST_KEY, TALLY_KEY, ISSUES_KEY].forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { /* хранилище недоступно */ }
    day = exampleDay(); book = {}; marks = {}; tally = {}; issues = [];
  }
  function loginHtml() {
    if (login.checking) return '<section><div class="card"><div class="muted">Проверяю вход…</div></div></section>';
    return '<section><div class="card"><h2>Вход</h2>' +
      '<div class="muted">Список общий для бригады. Введите пароль, который знают только свои.</div>' +
      (FIREBASE.email ? '' : '<label>Почта<input type="email" id="loginEmail" value="' + esc(safeGet(LOGIN_KEY) || '') + '" autocomplete="username"></label>') +
      '<label>Пароль<input type="password" id="loginPw" autocomplete="current-password"></label>' +
      '<label>Ваше имя (видно второму, кто правил последним)<input id="loginName" value="' + esc(safeGet(NAME_KEY) || '') + '" autocomplete="off"></label>' +
      (login.err ? '<div class="note">' + esc(login.err) + '</div>' : '') +
      '<div class="row"><button class="btn primary" data-act="login"' + (login.busy ? ' disabled' : '') + '>' + (login.busy ? 'Вхожу…' : 'Войти') + '</button></div>' +
      '</div></section>';
  }

  function onRemoteDay(snap) {
    if (!snap.exists) {
      sync.missing = true;
      // Общего дня ещё нет: первый, кто начнёт свой день, его создаст.
      if (!day.example) queueSync();
      rerender();
      return;
    }
    sync.missing = false;
    const d = snap.data();
    sync.by = d.by || null; sync.at = d.at || 0; sync.log = d.log || [];
    resolveName();
    if (d.rev === sync.rev) { rerender(); return; } // моя же запись или уже учтено
    const remote = migrate(JSON.parse(JSON.stringify(d.day || {})));
    const mine = plainDay();
    const changed = sync.base && !day.example ? JSON.stringify(mine) !== JSON.stringify(sync.base) : false;
    const next = changed ? migrate(C.mergeDay(sync.base, mine, remote)) : remote;
    if (bigDrop(day, next)) keep('перед правкой ' + (sync.byName && sync.byName !== 'вы' ? sync.byName : 'второго человека'));
    day = next;
    sync.base = JSON.parse(JSON.stringify(remote));
    sync.rev = d.rev;
    safeSet(KEY, JSON.stringify(day));
    if (changed) queueSync();
    rerender();
  }

  function onRemoteBook(snap) {
    if (!snap.exists) { if (Object.keys(book).length || Object.keys(marks).length || Object.keys(tally).length) queueSync(); return; }
    const d = snap.data();
    if (d.rev === sync.bookRev) return;
    const remote = { book: d.book || {}, marks: d.marks || {}, tally: d.tally || {} };
    const base = sync.bookBase || { book: {}, marks: {}, tally: {} };
    const merged = { book: C.mergeMap(base.book, book, remote.book), marks: C.mergeMap(base.marks, marks, remote.marks), tally: C.mergeMap(base.tally, tally, remote.tally) };
    const changed = JSON.stringify(merged) !== JSON.stringify(remote);
    book = merged.book; marks = merged.marks; tally = merged.tally;
    safeSet(BOOK_KEY, JSON.stringify(book)); safeSet(MARKS_KEY, JSON.stringify(marks)); saveTally();
    sync.bookBase = JSON.parse(JSON.stringify(remote));
    sync.bookRev = d.rev;
    if (changed) queueSync();
    rerender();
  }

  // Имена авторов правок. На GitHub-сайте автор и так записан именем, на странице в Claude — номером аккаунта.
  const nameCache = {};
  function whoName(id, selfAsYou) {
    if (!id) return '';
    if (selfAsYou && id === sync.me) return 'вы';
    if (sync.mode === 'firebase') return id;
    if (nameCache[id] === undefined) { fetchNames([id]); return ''; }
    return nameCache[id];
  }
  async function fetchNames(ids) {
    ids = ids.filter(function (id) { return id && nameCache[id] === undefined; });
    if (!ids.length || !sync.user) return;
    ids.forEach(function (id) { nameCache[id] = ''; });
    try {
      const ps = await sync.user.profiles(ids);
      ids.forEach(function (id) { nameCache[id] = (ps[id] && ps[id].name) || 'второй человек'; });
    } catch (e) { ids.forEach(function (id) { nameCache[id] = 'второй человек'; }); }
    updateTop(); if (tab === 'day') rerender();
  }
  // Короткая история правок общего дня: кто и когда. Подряд идущие правки одного человека в пределах получаса — одна запись.
  const LOG_KEEP = 4, LOG_GAP = 30 * 60000;
  function nextLog(prev, by, at) {
    const log = (prev || []).slice(-LOG_KEEP);
    const last = log[log.length - 1];
    if (last && last.by === by && at - last.at < LOG_GAP) log[log.length - 1] = { by: by, at: at };
    else log.push({ by: by, at: at });
    return log.slice(-LOG_KEEP);
  }

  async function resolveName() {
    if (sync.mode === 'firebase') { sync.byName = sync.by && sync.by === sync.me ? 'вы' : (sync.by || ''); return; }
    if (!sync.by || !sync.user) { sync.byName = ''; return; }
    if (sync.by === sync.me) { sync.byName = 'вы'; return; }
    try {
      const ps = await sync.user.profiles([sync.by]);
      const n = (ps[sync.by] && ps[sync.by].name) || 'второй человек';
      if (n !== sync.byName) { sync.byName = n; updateTop(); }
    } catch (e) { sync.byName = 'второй человек'; }
  }

  // Запись — не чаще раза в полсекунды, по одной за раз; перед записью подтягиваю свежее, чтобы не затереть чужое.
  function queueSync() {
    if (!sync.on || sync.readOnly || day.example) return;
    clearTimeout(sync.timer);
    sync.timer = setTimeout(pushSync, 600);
  }
  async function pushSync() {
    if (sync.busy) { sync.again = true; return; }
    sync.busy = true;
    try {
      const snap = await sync.dayRef.get();
      if (snap.exists && snap.data().rev !== sync.rev) { onRemoteDay(snap); }
      const payload = plainDay();
      if (!day.example && (!snap.exists || JSON.stringify(payload) !== JSON.stringify(sync.base))) {
        const rev = C.uid() + C.uid();
        sync.rev = rev;
        const at = Date.now(), log = nextLog(snap.exists ? snap.data().log : [], sync.me || '', at);
        await sync.dayRef.set({ day: payload, rev: rev, by: sync.me || '', at: at, log: log });
        sync.log = log;
        sync.base = payload; sync.missing = false;
      }
      const bsnap = await sync.bookRef.get();
      if (bsnap.exists && bsnap.data().rev !== sync.bookRev) onRemoteBook(bsnap);
      const bp = bookData();
      if (!day.example && (!bsnap.exists || JSON.stringify(bp) !== JSON.stringify(sync.bookBase))) {
        const rev = C.uid() + C.uid();
        sync.bookRev = rev;
        await sync.bookRef.set({ book: bp.book, marks: bp.marks, tally: bp.tally, rev: rev, by: sync.me || '', at: Date.now() });
        sync.bookBase = bp;
      }
      await pushIssues();
      sync.err = '';
    } catch (e) {
      if (e && (e.code === 'invalid_argument' || e.code === 'permission-denied')) { sync.readOnly = true; sync.err = 'У вас доступ только на просмотр: правки не попадут в общий день.'; }
      else if (e && e.code === 'quota_exceeded') sync.err = 'Общая база переполнена: ' + (e.message || '');
      else sync.err = 'Не получилось сохранить в общий день, попробую ещё раз при следующей правке.';
      rerender();
    } finally {
      sync.busy = false;
      if (sync.again) { sync.again = false; queueIssues(); }
    }
    updateTop();
  }

  // ---------- Копия базы раз в неделю ----------
  // Лежит в той же базе: shared/backups — список копий, shared/backup_<id>_<n> — сама копия кусками
  // (в одном документе базы помещается не больше ~256 КБ). Хранятся 4 последние недельные копии
  // и одна «перед восстановлением». Скриншоты «Что не так» в копию не попадают, только текст записей.
  const BK_WEEK = 7 * 86400000, BK_KEEP = 4, BK_PART = 100000;
  const bk = { list: null, busy: false, err: '', msg: '' };
  function bkIndex() { return sync.db.doc('shared/backups'); }
  function bkPart(id, n) { return sync.db.doc('shared/backup_' + id + '_' + n); }
  async function bkLoadList() {
    const snap = await bkIndex().get();
    bk.list = snap.exists ? (snap.data().items || []) : [];
    return bk.list;
  }
  // Снимок прямо из базы, а не из этого телефона: так в копию попадает ровно то, что видят все.
  async function bkSnapshot() {
    const ds = await sync.dayRef.get(), bs = await sync.bookRef.get(), is = await sync.issuesRef.get();
    const d = ds.exists ? ds.data() : {}, b = bs.exists ? bs.data() : {}, i = is.exists ? is.data() : {};
    return { day: d.day || null, book: b.book || {}, marks: b.marks || {}, tally: b.tally || {}, issues: i.items || {} };
  }
  function bkSummary(data) {
    return {
      people: ((data.day && data.day.people) || []).length, date: (data.day && data.day.date) || '',
      phones: Object.keys(data.book || {}).length, issues: Object.keys(data.issues || {}).length,
    };
  }
  async function bkWrite(kind, data) {
    const json = JSON.stringify(data);
    const parts = Math.max(1, Math.ceil(json.length / BK_PART));
    const now = new Date();
    // У недельной копии id — дата: если двое открыли сайт в один день, они пишут одну и ту же копию.
    const id = kind === 'week' ? 'w' + now.getFullYear() + C.pad2(now.getMonth() + 1) + C.pad2(now.getDate()) : 'u' + Date.now().toString(36);
    for (let n = 0; n < parts; n++) await bkPart(id, n).set({ s: json.slice(n * BK_PART, (n + 1) * BK_PART) });
    const list = (await bkLoadList()).filter(function (x) { return x.id !== id; });
    list.push(Object.assign({ id: id, kind: kind, at: Date.now(), by: sync.me || '', parts: parts }, bkSummary(data)));
    list.sort(function (a, b) { return a.at - b.at; });
    const weeks = list.filter(function (x) { return x.kind === 'week'; }).slice(-BK_KEEP);
    const undo = list.filter(function (x) { return x.kind === 'undo'; }).slice(-1);
    const keepIds = weeks.concat(undo).map(function (x) { return x.id; });
    const next = list.filter(function (x) { return keepIds.indexOf(x.id) >= 0; });
    await bkIndex().set({ items: next });
    bk.list = next;
    for (const x of list) {
      if (keepIds.indexOf(x.id) >= 0) continue;
      for (let n = 0; n < (x.parts || 1); n++) { const r = bkPart(x.id, n); await (r.delete ? r.delete() : r.set({ s: '' })); }
    }
  }
  function bkLastWeek() {
    const w = (bk.list || []).filter(function (x) { return x.kind === 'week'; });
    return w.length ? w[w.length - 1] : null;
  }
  // При входе: если последней недельной копии больше 7 дней, делаю новую.
  async function bkAuto() {
    if (!sync.on || sync.readOnly || bk.busy) return;
    bk.busy = true;
    try {
      await bkLoadList();
      const last = bkLastWeek();
      if (!last || Date.now() - last.at >= BK_WEEK) {
        const data = await bkSnapshot();
        if (data.day || Object.keys(data.book).length || Object.keys(data.issues).length) await bkWrite('week', data);
      }
      bk.err = '';
    } catch (e) { bk.err = 'Не получилось сделать недельную копию базы, попробую при следующем входе.'; }
    finally { bk.busy = false; if (tab === 'day') rerender(); }
  }
  async function bkRestore(id) {
    const x = (bk.list || []).find(function (y) { return y.id === id; });
    if (!x || bk.busy) return;
    bk.busy = true; bk.msg = ''; bk.err = '';
    try {
      let json = '';
      for (let n = 0; n < (x.parts || 1); n++) { const snap = await bkPart(id, n).get(); if (!snap.exists) throw new Error('part'); json += snap.data().s || ''; }
      const data = JSON.parse(json);
      keep('перед восстановлением копии');
      await bkWrite('undo', await bkSnapshot());
      if (data.day) { day = migrate(JSON.parse(JSON.stringify(data.day))); day.example = false; assignReport = null; }
      book = data.book || {}; marks = data.marks || {}; tally = data.tally || {};
      safeSet(BOOK_KEY, JSON.stringify(book)); safeSet(MARKS_KEY, JSON.stringify(marks)); saveTally();
      const old = {}; issues.forEach(function (y) { old[y.id] = y; });
      const items = data.issues || {};
      issues = Object.keys(items).map(function (iid) {
        const m = items[iid], y = old[iid];
        return Object.assign({ id: iid, img: '', up: true }, y || {}, { at: m.at, text: m.text, by: m.by, ctx: m.ctx, imgRemote: m.img && !(y && y.img) });
      }).sort(function (a, b) { return a.at < b.at ? -1 : a.at > b.at ? 1 : 0; });
      saveIssues();
      save();
      bk.msg = 'Вернул копию от ' + fmtAt(new Date(x.at).toISOString()) + '. Что было до этого, лежит в копии «перед восстановлением».';
    } catch (e) {
      bk.err = 'Не получилось восстановить копию. Ничего не поменялось, попробуйте ещё раз.';
    } finally { bk.busy = false; render(); }
  }
  function bkLabel(x) {
    const dp = C.dateParts(x.date);
    return fmtAt(new Date(x.at).toISOString()) + (x.kind === 'undo' ? ' · перед восстановлением' : '') +
      ' · день ' + (dp ? C.pad2(dp.d) + '.' + C.pad2(dp.m) : '?') + ', ' + (x.people || 0) + ' чел., телефонов ' + (x.phones || 0);
  }
  function bkCard() {
    if (!sync.on) return '';
    const list = (bk.list || []).slice().reverse();
    const last = bkLastWeek();
    const rows = list.map(function (x) {
      if (pendingConfirm === 'bkBack' + x.id) {
        return '<div class="hist"><div>' + bkLabel(x) + '</div><div class="note">День, телефоны, отметки «часто не выходит», подсчёт за месяц и записи «Что не так» станут как в этой копии у всех, кто вошёл. Всё, что сейчас, я сначала сохраню отдельной копией «перед восстановлением», а день ещё и в «Историю дня».</div>' +
          '<div class="confirm"><button class="btn danger" data-act="bkBack" data-v="' + x.id + '" data-yes="1">Восстановить</button><button class="btn" data-act="cancelConfirm">Отмена</button></div></div>';
      }
      return '<div class="hist"><div>' + bkLabel(x) + '</div>' + (sync.readOnly ? '' : '<button class="btn small" data-act="bkBack" data-v="' + x.id + '"' + (bk.busy ? ' disabled' : '') + '>Восстановить из копии</button>') + '</div>';
    }).join('');
    return '<div class="card"><details' + (/^bkBack/.test(pendingConfirm || '') || bk.msg ? ' open' : '') + '><summary>Копия базы раз в неделю' +
      (last ? ' · последняя ' + fmtAt(new Date(last.at).toISOString()).slice(0, 5) : '') + '</summary>' +
      '<div class="muted">Раз в неделю, при входе, сайт сам сохраняет копию всей базы: день, телефоны, отметки, подсчёт за месяц и записи «Что не так» (без скриншотов). Хранятся 4 последние недели. Копия лежит в той же базе: она спасает от случайного удаления и ошибок, но не от потери самой базы. Для этого есть «Резервная копия файлом».</div>' +
      (bk.msg ? '<div class="note">' + esc(bk.msg) + '</div>' : '') + (bk.err ? '<div class="note">' + esc(bk.err) + '</div>' : '') +
      (bk.list === null ? '<div class="muted">Загружаю список копий…</div>' : rows || '<div class="muted">Копий пока нет.</div>') +
      '</details></div>';
  }

  function syncLine() {
    if (!sync.on) return '';
    if (sync.err) return sync.err;
    const t = sync.at ? new Date(sync.at) : null;
    const when = t ? C.pad2(t.getHours()) + ':' + C.pad2(t.getMinutes()) : '';
    const log = (sync.log || []).slice(-LOG_KEEP);
    if (log.length) {
      const today = new Date().toDateString();
      return 'Общий день' + (sync.readOnly ? ' (только просмотр)' : '') + ' · правки: ' + log.map(function (x) {
        const t = new Date(x.at);
        const hm = C.pad2(t.getHours()) + ':' + C.pad2(t.getMinutes());
        return (whoName(x.by, true) || '…') + ' ' + (t.toDateString() === today ? hm : C.pad2(t.getDate()) + '.' + C.pad2(t.getMonth() + 1) + ' ' + hm);
      }).join(' · ');
    }
    return 'Общий день' + (sync.readOnly ? ' (только просмотр)' : '') + (sync.byName && when ? ' · правка: ' + sync.byName + ', ' + when : '');
  }

  function syncCard() {
    if (sync.on && sync.mode === 'firebase') {
      return '<div class="card"><h2>Общий доступ</h2><div class="muted">День общий для всех, кто вошёл. Ваше имя видно второму.</div>' +
        '<div class="namerow"><input id="myName" value="' + esc(sync.me || '') + '" placeholder="Ваше имя" autocomplete="off"><button class="btn small" data-act="logout">Выйти</button></div></div>';
    }
    if (sync.on) {
      return '<div class="card"><h2>Общий доступ</h2><div class="muted">' +
        (sync.readOnly ? 'Вы видите общий день, но менять его не можете. Попросите владельца страницы дать вам доступ «Редактор».'
          : 'День, телефоны и отметки общие для всех, кому открыта эта страница. Правки второго человека появляются сами, через пару секунд.') +
        ' Второго человека добавляет владелец страницы: кнопка «Поделиться» вверху страницы, его почта, доступ «Редактор». Входить нужно под своим аккаунтом Claude.</div>' +
        (sync.missing && day.example ? '<div class="note">Общий день ещё пустой. Нажмите «Начать свой день», и он станет общим.</div>' : '') +
        '</div>';
    }
    return '<div class="card"><h2>Общий доступ</h2><div class="muted">На этом сайте день хранится только в этом браузере. Общий день для двоих работает на странице в Claude. Ещё можно передавать день файлом: «Сохранить день в файл» и «Открыть файл дня» ниже.</div></div>';
  }

  let dlCap = null;
  if (window.claude && window.claude.use) {
    dlCap = window.claude.use('downloads').catch(function () { return null; });
  }
  async function offer(filename, blob) {
    const msg = document.getElementById('dlMsg');
    const say = function (t) { if (msg) msg.textContent = t; };
    const dl = dlCap ? await dlCap : null;
    if (dl) {
      try { await dl.save({ filename: filename, data: blob }); say('Готово: ' + filename); }
      catch (e) {
        if (e && e.code === 'declined') say('Скачивание отменено.');
        else if (e && e.code === 'rate_limited') say('Уже открыт запрос на скачивание. Подтвердите его или подождите.');
        else say('Не получилось скачать: ' + ((e && e.message) || 'ошибка') + '.');
      }
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
    say('Готово: ' + filename);
  }
  // Картинка таблицы для чатов: та же таблица, что в предпросмотре, целиком, без прокрутки.
  function tableImage() {
    const holder = document.createElement('div');
    const w = Math.max(720, 60 + 250 * day.gazelles.length);
    holder.style.cssText = 'position:fixed;left:-20000px;top:0;width:' + w + 'px;background:#fff;padding:10px';
    holder.innerHTML = '<div class="preview shotsrc" style="overflow:visible;border:0">' + previewHtml() + '</div>';
    document.body.appendChild(holder);
    return window.html2canvas(holder, { backgroundColor: '#ffffff', scale: 2, logging: false })
      .then(function (canvas) { return new Promise(function (res) { canvas.toBlob(res, 'image/png'); }); })
      .finally(function () { holder.remove(); });
  }
  function shotName() { return C.fileNames(day).word.replace(/\.docx$/, '.png'); }
  function shotSay(t) { const m = document.getElementById('shotMsg'); if (m) m.textContent = t; }
  function canShareFiles() {
    try { return !!(navigator.canShare && navigator.canShare({ files: [new File([''], 'a.png', { type: 'image/png' })] })); } catch (e) { return false; }
  }
  // Копирование: ClipboardItem создаётся сразу по нажатию (так требует Safari), картинка дорисовывается следом.
  function copyShot() {
    const blob = tableImage();
    let p;
    try {
      if (!navigator.clipboard || !window.ClipboardItem) throw new Error('нет буфера');
      p = navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    } catch (e) { p = Promise.reject(e); }
    shotSay('Делаю картинку…');
    return p.then(function () { shotSay('Картинка скопирована. Вставьте её в чат.'); })
      .catch(function () {
        shotSay('Этот браузер не дал скопировать картинку, сохраняю файлом.');
        return blob.then(function (b) { return offer(shotName(), b); }).then(function () { shotSay('Скопировать не вышло, картинка сохранена файлом: ' + shotName()); });
      });
  }
  async function shareShot() {
    shotSay('Делаю картинку…');
    const b = await tableImage();
    try { await navigator.share({ files: [new File([b], shotName(), { type: 'image/png' })] }); shotSay(''); }
    catch (e) { if (!e || e.name !== 'AbortError') { await offer(shotName(), b); shotSay('Картинка сохранена файлом.'); } else shotSay(''); }
  }

  async function downloadWord() {
    const doc = window.Gen.buildWord(day, window.docx);
    const blob = await window.docx.Packer.toBlob(doc);
    await offer(C.fileNames(day).word, blob);
  }
  async function downloadExcel() {
    const wb = window.Gen.buildExcel(day, window.ExcelJS);
    const buf = await wb.xlsx.writeBuffer();
    await offer(C.fileNames(day).excel, new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  }

  // ---------- действия ----------
  function setPath(path, value) {
    const keys = path.split('.');
    let o = day;
    for (let i = 0; i < keys.length - 1; i++) o = o[keys[i]];
    o[keys[keys.length - 1]] = value;
  }
  function person(id) { return day.people.find(function (p) { return p.id === id; }); }
  function moveWithin(p, dir) {
    const same = day.people.filter(function (x) { return (x.gazId || '') === (p.gazId || '') && C.reserveKind(x) === C.reserveKind(p) && (x.status === 'refused') === (p.status === 'refused'); });
    const k = same.indexOf(p);
    const other = same[k + dir];
    if (!other) return;
    const a = day.people.indexOf(p), b = day.people.indexOf(other);
    day.people[a] = other; day.people[b] = p;
  }
  function toEnd(p) { day.people.splice(day.people.indexOf(p), 1); day.people.push(p); }

  $main.addEventListener('input', function (e) {
    const t = e.target;
    if (t.dataset.path) {
      let v = t.type === 'checkbox' ? t.checked : t.value;
      if (t.dataset.path.endsWith('.capacity')) v = Math.max(0, parseInt(v, 10) || 0);
      setPath(t.dataset.path, v);
      if (t.dataset.path === 'date' || t.dataset.path === 'place' || t.dataset.path === 'brigadier') updateTop();
      save();
    }
  });
  $main.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target.id === 'loginPw') doLogin(); });
  $main.addEventListener('change', function (e) {
    const t = e.target;
    if (t.id === 'myName') { sync.me = t.value.trim(); safeSet(NAME_KEY, sync.me); return; }
    if (t.dataset.pf) {
      const p = person(t.dataset.id);
      if (!p) return;
      if (t.dataset.pf === 'name') { Object.assign(p, splitName(t.value)); fillPhone(p); }
      else if (t.dataset.pf === 'phone') { p.phone = C.formatPhone(t.value); rememberPhone(p); openRows.delete(p.id); }
      else {
        const s = t.value.trim() ? C.findStopByText(t.value, stopsList()) : null;
        p.stop = s ? s.name : t.value.trim();
      }
      save(); render(); return;
    }
    const act = t.dataset.act;
    if (act === 'pGaz') {
      // «→ Замена поле/цех»: человек остаётся со всеми данными, только переезжает в список замены.
      const p = person(t.dataset.id), r = t.value === 'replaceField' ? 'поле' : t.value === 'replaceShop' ? 'цех' : '';
      p.gazId = r ? '' : t.value; p.reserve = r;
      if (r) p.kind = r;
      toEnd(p); flash(p.id);
    }
    else if (act === 'moveAll' && t.value) {
      day.people.filter(function (p) { return !gById(p.gazId) && !C.reserveKind(p) && p.status !== 'refused'; }).forEach(function (p) {
        if (t.value === 'replace') p.reserve = p.kind === 'цех' ? 'цех' : 'поле'; else p.gazId = t.value;
        toEnd(p);
      });
    }
    else if (act === 'gContact' && t.value) { day.gazelles[+t.dataset.i].contact = C.accusative(C.personLabel(person(t.value))); }
    else if (t.dataset.tally) {
      const k = t.dataset.tally, v = tally[k] || { d: 0, m: 0 };
      v[t.dataset.f] = Math.max(0, parseInt(t.value, 10) || 0); v.manual = true;
      tally[k] = v; saveTally(); queueSync(); render(); return;
    }
    else if (t.dataset.path) { if (t.dataset.path === 'stopsText' || t.dataset.path === 'latinNames') save(); return; }
    else return;
    save(); render();
  });

  // Плавно раскрываю только тот блок, который открыли сейчас.
  $main.addEventListener('toggle', function (e) {
    const d = e.target;
    if (d.id === 'tallyDays') tallyOpen = d.open;
    if (d.tagName !== 'DETAILS' || !d.open) return;
    if (d.dataset.kept) { delete d.dataset.kept; return; }
    d.classList.add('opening');
    setTimeout(function () { d.classList.remove('opening'); }, 600);
  }, true);

  $main.addEventListener('click', async function (e) {
    const b = e.target.closest('[data-act]');
    if (!b || b.tagName === 'SELECT') return;
    const act = b.dataset.act, i = +b.dataset.i, id = b.dataset.id;
    const yes = b.dataset.yes === '1';
    switch (act) {
      case 'startOwn': {
        keep('перед «Начать свой день»');
        day = C.newDay();
        const ps = prevSnap();
        if (ps) applySnap(ps);
        break;
      }
      case 'useSnap': {
        if (!yes) { pendingConfirm = 'useSnap'; break; }
        pendingConfirm = null;
        const ps = prevSnap();
        if (ps) applySnap(ps);
        break;
      }
      case 'pDriver': { const p = person(id); p.driver = !p.driver; break; }
      case 'pFlaky': { const p = person(id); setFlaky(p, !isFlaky(p)); render(); return; }
      case 'shotPick': document.getElementById('shotOpen').click(); return;
      case 'shotDrop': issueDraft.img = ''; render(); return;
      case 'issueAdd': {
        const ta = document.getElementById('issueText');
        issueDraft.text = ta ? ta.value : issueDraft.text;
        if (!issueDraft.text.trim() && !issueDraft.img) { issueMsg = 'Напишите, что не так, или приложите скриншот.'; render(); return; }
        issues.push({ id: C.uid(), at: new Date().toISOString(), text: issueDraft.text.trim(), img: issueDraft.img, by: sync.mode === 'firebase' ? (sync.me || '') : '', up: false,
          ctx: { tab: lastTab, w: window.innerWidth, h: window.innerHeight, date: day.date, ua: navigator.userAgent } });
        if (saveIssues()) { issueDraft = { text: '', img: '' }; issueMsg = 'Записал. Всего записей: ' + issues.length + '.'; queueIssues(); }
        else { issues.pop(); issueMsg = 'Не хватило места в памяти браузера. Скачайте записи файлом и очистите список.'; }
        render(); return;
      }
      case 'issueDel': dropIssues(function (x) { return x.id === id; }); render(); return;
      case 'issuesClear':
        if (!yes) { pendingConfirm = 'issuesClear'; render(); return; }
        pendingConfirm = null; dropIssues(function () { return true; }); issueMsg = ''; render(); return;
      case 'issuesExport': {
        await offer('chto_ne_tak_' + new Date().toISOString().slice(0, 10) + '.html', new Blob([issuesReport()], { type: 'text/html' }));
        return;
      }
      case 'cancelConfirm': pendingConfirm = null; break;
      case 'bkBack': {
        if (!yes) { pendingConfirm = 'bkBack' + b.dataset.v; bk.msg = ''; break; }
        pendingConfirm = null;
        await bkRestore(b.dataset.v);
        return;
      }
      case 'histBack': {
        if (!yes) { pendingConfirm = 'histBack' + i; break; }
        pendingConfirm = null;
        const h = loadHist()[i];
        if (!h) break;
        keep('перед возвратом');
        day = migrate(h.day); day.example = false; assignReport = null;
        break;
      }
      case 'newDay':
        if (!yes) { pendingConfirm = 'newDay'; break; }
        pendingConfirm = null;
        keep('перед «Новый день»');
        day.people = []; day.example = false; assignReport = null;
        { const dp = C.dateParts(day.date); const nd = dp ? new Date(dp.y, dp.m - 1, dp.d + 1) : new Date(Date.now() + 86400000);
          day.date = nd.getFullYear() + '-' + C.pad2(nd.getMonth() + 1) + '-' + C.pad2(nd.getDate()); }
        day.gazelles.forEach(function (g) { g.contact = ''; });
        day.zp = ''; day.replaceField = '-'; day.replaceShop = '-';
        break;
      case 'exportJson': {
        const name = 'den_' + dateShort().replace('.', '_') + '_' + C.translit(day.brigadier || 'brigada') + '.json';
        const data = Object.assign({}, day, { phonebook: book, marks: marks, tally: tally });
        await offer(name, new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }));
        return;
      }
      case 'importJson': document.getElementById('fileOpen').click(); return;
      case 'tallyMonth': {
        const ym = (tallyMonth || (day.date || '').slice(0, 7) || new Date().toISOString().slice(0, 7)).split('-');
        const nd = new Date(+ym[0], +ym[1] - 1 + (+b.dataset.v), 1);
        tallyMonth = nd.getFullYear() + '-' + C.pad2(nd.getMonth() + 1); tallyNote = '';
        render(); return;
      }
      case 'tallyDel': delete tally[b.dataset.k]; saveTally(); queueSync(); render(); return;
      case 'tallyAdd': {
        const v = (document.getElementById('tallyAdd') || {}).value || '';
        if (!/^\d{4}-\d{2}-\d{2}$/.test(v)) return;
        if (!tally[v]) tally[v] = { d: 0, m: 0, manual: true };
        tallyMonth = v.slice(0, 7); tallyOpen = true; saveTally(); queueSync(); render(); return;
      }
      case 'tallyPaste': {
        const ym = tallyMonth || (day.date || '').slice(0, 7) || new Date().toISOString().slice(0, 7);
        if (!C.parseTally) { tallyNote = 'Страница загрузилась не до конца. Обновите её и вставьте ещё раз.'; render(); return; }
        const got = C.parseTally((document.getElementById('tallyPaste') || {}).value, ym);
        const ks = Object.keys(got).sort();
        if (!ks.length) { tallyNote = 'Не нашёл строк вида «1- 1 Д/1м».'; render(); return; }
        ks.forEach(function (k) { tally[k] = { d: got[k].d, m: got[k].m, manual: true }; });
        tallyMonth = ks[0].slice(0, 7); tallyNote = 'Внесено дней: ' + ks.length + '.';
        saveTally(); queueSync(); render(); return;
      }
      case 'tallyCopy': {
        const ym = tallyMonth || (day.date || '').slice(0, 7) || new Date().toISOString().slice(0, 7);
        const m = document.getElementById('tallyMsg');
        try { await navigator.clipboard.writeText(C.tallyText(tally, ym).text); if (m) m.textContent = 'Скопировано.'; }
        catch (err) { if (m) m.textContent = 'Не получилось скопировать.'; }
        return;
      }
      case 'gKind': day.gazelles[i].kind = b.dataset.v; break;
      case 'gLetter': { const g = day.gazelles[i]; g.letter = C.owner(g) === b.dataset.v ? '' : b.dataset.v; break; }
      case 'gNoOrder': day.gazelles[i].noOrder = !day.gazelles[i].noOrder; break;
      case 'gVehicle': {
        const g = day.gazelles[i];
        if ((g.vehicle || 'газель') === b.dataset.v) return;
        g.vehicle = b.dataset.v;
        if (g.vehicle === 'машина' && +g.capacity >= 10) g.capacity = 5;
        if (g.vehicle === 'машина' && !String(g.fuel || '').trim()) g.fuel = '1000';
        if (g.vehicle === 'газель' && +g.capacity < 10) g.capacity = 19;
        break;
      }
      case 'gAddCar': { const g = C.newGazelle(); g.vehicle = 'машина'; g.capacity = 5; g.fuel = '1000'; day.gazelles.push(g); break; }
      case 'pFind': {
        const el = $main.querySelector('.person[data-id="' + id + '"]');
        if (!el) return;
        const dt = el.closest('details'); if (dt) dt.open = true;
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        // Подсвечиваю, когда прокрутка почти доехала, иначе вспышку не видно.
        flash(id, 'found', 450);
        el.classList.remove('found'); setTimeout(function () { el.classList.add('found'); }, 450);
        return;
      }
      case 'sortAlpha': C.sortAlpha(day, b.dataset.g, b.dataset.v, b.dataset.r); break;
      case 'sortAll': C.sortAll(day, b.dataset.v); break;
      case 'login': doLogin(); return;
      case 'logout': await doLogout(); render(); return;
      case 'brigAdd': showBrig = true; render(); return;
      case 'brigDel': showBrig = false; day.brigadier = ''; break;
      case 'theme': setTheme(b.dataset.v); render(); return;
      case 'assign': {
        const mode = b.dataset.v;
        const vans = day.gazelles.filter(function (g) { return g.vehicle !== 'машина'; });
        const inVans = day.people.some(function (p) { return p.status !== 'refused' && vans.some(function (g) { return g.id === p.gazId; }); });
        if (mode === 'all' && inVans && !yes) { pendingConfirm = 'assignAll'; break; }
        pendingConfirm = null;
        if (mode === 'all') keep('перед «Разложить всех заново»');
        assignReport = assignSummary(C.autoAssign(day, stopsList(), mode));
        break;
      }
      case 'pKind': { const p = person(id); p.kind = p.kind === 'цех' ? 'поле' : 'цех'; break; }
      case 'pPhone': {
        openRows.add(id); render();
        const inp = $main.querySelector('input.pphone[data-id="' + id + '"]');
        if (inp) inp.focus();
        return;
      }
      case 'gUp': case 'gDown': {
        const j = act === 'gUp' ? i - 1 : i + 1;
        if (j < 0 || j >= day.gazelles.length) return;
        const g = day.gazelles; const tmp = g[i]; g[i] = g[j]; g[j] = tmp; break;
      }
      case 'gAdd': day.gazelles.push(C.newGazelle()); break;
      case 'gDel':
        if (!yes) { pendingConfirm = 'gDel' + i; break; }
        pendingConfirm = null;
        keep('перед удалением газели');
        { const gid = day.gazelles[i].id; day.people.forEach(function (p) { if (p.gazId === gid) p.gazId = ''; }); day.gazelles.splice(i, 1); }
        break;
      case 'parse': {
        assignReport = null;
        const ta = document.getElementById('vkText');
        const text = ta ? ta.value : vkDraft;
        vkDraft = text;
        if (!text.trim()) { parseReport = '<div class="note">Вставьте сюда сообщения из чата ВК.</div>'; break; }
        const dp = C.dateParts(day.date);
        if (!dp) { parseReport = '<div class="note">Сначала укажите дату на вкладке «День».</div>'; break; }
        if (day.example) { const fresh = C.newDay(); fresh.date = day.date; day = fresh; }
        const r = C.parseVk(text, dp.d, dp.m, stopsList());
        const existing = {};
        day.people.forEach(function (p) { existing[C.norm(C.personLabel(p))] = true; });
        const was = {};
        day.people.forEach(function (p) { was[C.norm(C.personLabel(p))] = p; });
        let added = 0, dup = [], diff = [];
        r.people.forEach(function (x) {
          const k = C.norm(C.personLabel(x));
          if (existing[k]) {
            const o = was[k];
            if (o && C.norm(o.stop) !== C.norm(x.stop)) diff.push(C.personLabel(x) + ': было «' + o.stop + '», теперь «' + x.stop + '»');
            else dup.push(C.personLabel(x));
            return;
          }
          existing[k] = true;
          const np = { id: C.uid(), surname: x.surname, initial: x.initial, stop: x.stop, kind: x.kind, phone: x.phone || '', gazId: '', status: 'ok', flags: x.flags, raw: x.raw };
          if (np.phone) rememberPhone(np); else fillPhone(np);
          day.people.push(np);
          flash(np.id);
          added++;
        });
        // Новых сразу раскладываю по газелям; кто уже сидит в газели — не трогаю.
        const vansNow = day.gazelles.some(function (g) { return g.vehicle !== 'машина'; });
        let placedNote = '';
        if (added && vansNow) {
          const ar = C.autoAssign(day, stopsList(), 'free');
          assignReport = assignSummary(ar);
          placedNote = 'Разложил по газелям: ' + ar.placed + '. ' + (ar.left.length ? 'Остались без газели: ' + ar.left.length + ' (почему — в «Распределить по газелям» ниже). ' : '');
        }
        if (added) vkDraft = '';
        const flagged = r.people.filter(function (x) { return x.flags.length; }).length;
        const other = r.skipped.filter(function (s) { return s.reason === 'другая дата'; }).length;
        const bad = r.skipped.filter(function (s) { return s.reason !== 'другая дата'; });
        parseReport = '<div class="note">Добавлено: ' + added + '. ' + placedNote +
          (diff.length ? '<br><b>⚠ Уже в списке, но с другой остановкой:</b> ' + esc(diff.join('; ')) + '. Оставил как было.<br>' : '') +
          (flagged ? 'Проверить: ' + flagged + ' (помечены ⚠). ' : '') +
          (dup.length ? 'Уже были в списке: ' + esc(dup.join(', ')) + '. ' : '') +
          (other ? 'Строк с другой датой: ' + other + '. ' : '') +
          (bad.length ? '<br>Не разобрал: ' + bad.map(function (s) { return '«' + esc(s.raw) + '»'; }).join(', ') : '') + '</div>';
        break;
      }
      case 'clearAll':
        if (!yes) { pendingConfirm = 'clearAll'; break; }
        pendingConfirm = null;
        keep('перед «Очистить все газели»');
        day.people = []; assignReport = null; parseReport = '';
        break;
      case 'vkClear': vkDraft = ''; parseReport = ''; break;
      case 'pAdd': {
        const g = gById(b.dataset.g);
        const r = b.dataset.r || '';
        day.people.push({ id: C.uid(), surname: '', initial: '', stop: '', kind: r || (g && g.kind === 'Цех' ? 'цех' : 'поле'), phone: '', gazId: b.dataset.g, status: 'ok', flags: [], reserve: r });
        break;
      }
      case 'pStatus': { const p = person(id); const was = p.status; p.status = b.dataset.v; if ((was === 'refused') !== (p.status === 'refused')) toEnd(p); break; }
      case 'pUp': moveWithin(person(id), -1); break;
      case 'pDown': moveWithin(person(id), 1); break;
      case 'pDel': if (!yes) { pendingConfirm = 'pDel' + id; break; } pendingConfirm = null; keep('перед удалением ' + C.personLabel(person(id))); day.people.splice(day.people.indexOf(person(id)), 1); break;
      case 'pOk': person(id).flags = []; break;
      case 'pStopFix': {
        const p = person(id);
        p.stop = b.dataset.v;
        p.flags = (p.flags || []).filter(function (f) { return f !== 'остановка не распознана'; });
        break;
      }
      case 'pSeat': {
        const p = person(id);
        p.gazId = b.dataset.g; p.reserve = ''; toEnd(p); flash(p.id);
        break;
      }
      case 'shotCopy':
        b.disabled = true;
        copyShot().catch(function (err) { shotSay('Не получилось: ' + err.message); }).finally(function () { b.disabled = false; });
        return;
      case 'shotShare': case 'shotSave':
        try { b.disabled = true; if (act === 'shotShare') await shareShot(); else { shotSay('Делаю картинку…'); await offer(shotName(), await tableImage()); shotSay(''); } }
        catch (err) { shotSay('Не получилось: ' + err.message); }
        finally { b.disabled = false; }
        return;
      case 'dlWord': case 'dlExcel':
        try { b.disabled = true; await (act === 'dlWord' ? downloadWord() : downloadExcel()); }
        catch (err) { const m = document.getElementById('dlMsg'); if (m) m.textContent = 'Ошибка при сборке файла: ' + err.message; }
        finally { b.disabled = false; }
        return;
      default: return;
    }
    save(); render();
  });

  document.getElementById('fileOpen').addEventListener('change', function (e) {
    const f = e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = function () {
      try {
        const opened = migrate(JSON.parse(rd.result));
        keep('перед «Открыть файл дня»');
        day = opened;
        Object.assign(book, day.phonebook || {});
        saveBook();
        Object.assign(marks, day.marks || {});
        safeSet(MARKS_KEY, JSON.stringify(marks));
        Object.keys(day.tally || {}).forEach(function (k) { if (!tally[k] || !tally[k].manual) tally[k] = day.tally[k]; });
        saveTally();
        delete day.phonebook;
        delete day.marks;
        delete day.tally;
        day.example = false; save(); tab = 'people'; render();
      }
      catch (err) { parseReport = '<div class="note">Это не файл дня: ' + esc(err.message) + '</div>'; render(); }
    };
    rd.readAsText(f);
    e.target.value = '';
  });

  render();
  initSync();
  initFirebase();
})();
</script>
